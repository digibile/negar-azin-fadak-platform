name: Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Test API
        working-directory: apps/api
        run: npm test
      - name: Build web
        working-directory: apps/web
        run: npm run build
