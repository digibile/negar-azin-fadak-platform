name: Platform Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build API
        working-directory: apps/api
        run: npm run build
      - name: Test API
        working-directory: apps/api
        run: npm test
      - name: Build web
        working-directory: apps/web
        run: npm run build

  deploy-sookar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: SSH setup
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Package and upload
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.cache' --exclude='*.log' --exclude='tmp' --exclude='temp' --exclude='backups' -czf /tmp/app.tar.gz .
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -p "${{ secrets.DEPLOY_PORT }}" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'mkdir -p /home/sookar/domains/sookar.ir/negar-platform/releases'
          ssh -p "${{ secrets.DEPLOY_PORT }}" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'cat > /home/sookar/domains/sookar.ir/negar-platform/app.tar.gz' < /tmp/app.tar.gz
      - name: Docker deploy
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -p "${{ secrets.DEPLOY_PORT }}" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'set -e
            BASE=/home/sookar/domains/sookar.ir/negar-platform
            RELEASE="$BASE/releases/${{ github.sha }}"
            mkdir -p "$RELEASE"
            tar -xzf "$BASE/app.tar.gz" -C "$RELEASE"
            cp "$BASE/.env" "$RELEASE/.env"
            chmod 600 "$RELEASE/.env"
            cd "$RELEASE"
            docker compose --project-name naf-sookar -f docker-compose.production.yml config >/dev/null
            docker compose --project-name naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
            ln -sfn "$RELEASE" "$BASE/current"
            rm -f "$BASE/app.tar.gz"
          '
      - name: Nginx and external health
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          ssh -p "${{ secrets.DEPLOY_PORT }}" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'set -e
            DOMAIN=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
            test -f "$DOMAIN"
            cp -a "$DOMAIN" "/root/sookar-domain-backup-$(date +%Y%m%d-%H%M%S).conf"
            python3 - "$DOMAIN" <<'PY'
from pathlib import Path
import re,sys
p=Path(sys.argv[1]); s=p.read_text()
def block(text,start):
    op=text.find("{",start)
    if op<0:return None
    d=0
    for i in range(op,len(text)):
        if text[i]=="{":d+=1
        elif text[i]=="}":
            d-=1
            if d==0:return start,i+1
    return None
m=re.search(r"server\\s*\\{",s)
while m:
    b=block(s,m.start())
    if not b: break
    a,z=b; sb=s[a:z]
    if re.search(r"server_name[^;]*\\bsookar\\.ir\\b",sb):
        lm=re.search(r"location\\s+/\\s*\\{",sb)
        if lm:
            la,lz=block(sb,lm.start()); loc=sb[la:lz]
            if re.search(r"proxy_pass\\s+[^;]+;",loc):
                loc=re.sub(r"proxy_pass\\s+[^;]+;","proxy_pass http://127.0.0.1:3100;",loc,count=1)
            else:
                pos=loc.rfind("}"); loc=loc[:pos]+"        proxy_pass http://127.0.0.1:3100;\\n"+loc[pos:]
            sb=sb[:la]+loc+sb[lz:]
        else:
            pos=sb.rfind("}"); sb=sb[:pos]+"\\n    location / {\\n        proxy_http_version 1.1;\\n        proxy_set_header Host $host;\\n        proxy_set_header X-Real-IP $remote_addr;\\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\\n        proxy_set_header X-Forwarded-Proto $scheme;\\n        proxy_pass http://127.0.0.1:3100;\\n    }\\n"+sb[pos:]
        s=s[:a]+sb+s[z:]; p.write_text(s); break
    m=re.search(r"server\\s*\\{",s,z)
else: raise SystemExit("Sookar server block not found")
PY
            /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
            nginx -t
            systemctl reload nginx
            curl -fsS http://127.0.0.1:3100/ >/dev/null
          '
          for i in $(seq 1 20); do
            code=$(curl -k -L -sS -o /tmp/sookar.html -w '%{http_code}' https://sookar.ir/ || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          cat /tmp/sookar.html | head -c 1000 || true
          exit 1
