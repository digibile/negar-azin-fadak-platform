name: Deploy Sookar Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sookar-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          SHA="${GITHUB_SHA}"
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.cache' --exclude='*.log' --exclude='tmp' --exclude='temp' --exclude='backups' -czf /tmp/negar-platform.tar.gz .
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "mkdir -p '$BASE/releases/$SHA'"
          scp -P "$PORT" -o BatchMode=yes /tmp/negar-platform.tar.gz "$HOST:$BASE/negar-platform.tar.gz"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "set -e
            RELEASE='$BASE/releases/$SHA'
            tar -xzf '$BASE/negar-platform.tar.gz' -C "$RELEASE"
            cp '$BASE/.env' "$RELEASE/.env"
            chmod 600 "$RELEASE/.env"
            cd "$RELEASE"
            docker compose -p naf-sookar -f docker-compose.production.yml config >/dev/null
            docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
            ln -sfn "$RELEASE" '$BASE/current'
            rm -f '$BASE/negar-platform.tar.gz'
            docker compose -p naf-sookar -f docker-compose.production.yml ps
          "

      - name: Configure Nginx
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'python3 - <<'"'"'PY'"'"'
from pathlib import Path
import re, shutil, subprocess

p = Path("/usr/local/directadmin/data/users/sookar/nginx.conf")
backup = p.with_name("nginx.conf.before-platform-" + __import__("datetime").datetime.now().strftime("%Y%m%d-%H%M%S"))
shutil.copy2(p, backup)
subprocess.run(["/usr/local/directadmin/custombuild/build", "rewrite_confs"], check=True, stdout=subprocess.DEVNULL)

text = p.read_text()

def blocks(s, word):
    out=[]
    for m in re.finditer(r"(?m)^\s*"+word+r"\b[^\{]*\{", s):
        d=0
        for i in range(m.end()-1,len(s)):
            if s[i]=="{": d+=1
            elif s[i]=="}":
                d-=1
                if d==0:
                    out.append((m.start(),i+1)); break
    return out

servers=[x for x in blocks(text,"server") if re.search(r"server_name\s+[^;]*\bsookar\.ir\b",text[x[0]:x[1]])]
if not servers:
    raise SystemExit("Sookar server block not found")

api='''    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:4000;
    }
'''
root='''    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3100;
    }
'''

parts=[]; cur=0
for a,b in servers:
    parts.append(text[cur:a]); block=text[a:b]
    locs=blocks(block,"location")
    rootloc=None
    for la,lb in locs:
        if re.match(r"(?s)^\s*location\s+/\s*\{",block[la:lb]):
            rootloc=(la,lb); break
    if rootloc:
        la,lb=rootloc
        block=block[:la]+root+block[lb:]
    else:
        block=block[:block.rfind("}")]+root+block[block.rfind("}"):]
    block=re.sub(r"(?ms)^\s*location\s+\^~\s+/api/\s*\{.*?^\s*\}\s*\n?", "", block)
    first=re.search(r"(?m)^\s*location\s+",block)
    pos=first.start() if first else block.rfind("}")
    block=block[:pos]+api+block[pos:]
    parts.append(block); cur=b
parts.append(text[cur:])
p.write_text("".join(parts))
subprocess.run(["nginx","-t"],check=True)
subprocess.run(["systemctl","reload","nginx"],check=True)
print("NGINX_OK")
PY'

      - name: Verify internal services
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          ssh -p "$PORT" -o BatchMode=yes "$HOST" '
            set -e
            curl -fsS http://127.0.0.1:3100/ >/dev/null
            curl -fsS http://127.0.0.1:4000/health >/dev/null
            docker ps --format "{{.Names}} {{.Ports}}" | grep -F "naf-sookar-api-1"
          '

      - name: Verify public API
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -k -sS -o /tmp/api.txt -w '%{http_code}' https://sookar.ir/api/session/properties || true)
            echo "attempt=$i http=$code"
            if [ "$code" != "502" ] && [ "$code" != "000" ]; then
              cat /tmp/api.txt
              exit 0
            fi
            sleep 3
          done
          cat /tmp/api.txt || true
          exit 1

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          curl -k -fsS https://sookar.ir/login >/dev/null
          echo SOOKAR_LOGIN_OK
