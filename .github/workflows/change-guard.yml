name: Change Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: change-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm --filter api migrate

      - name: Platform integrity
        run: pnpm verify:platform

      - name: Full test suite
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Forbidden product terminology guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next '\bERP\b' .; then
            echo "::error::Forbidden product terminology detected."
            exit 1
          fi
