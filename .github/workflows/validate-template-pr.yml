name: Validate template pull request

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/validate-template-pr.yml"

permissions:
  contents: read

concurrency:
  group: validate-template-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify platform integrity
        run: pnpm verify:platform
      - name: Build API
        working-directory: apps/api
        run: pnpm build
      - name: Run database migrations
        working-directory: apps/api
        run: pnpm migrate
      - name: Test API
        working-directory: apps/api
        run: pnpm test
      - name: Build web
        working-directory: apps/web
        run: pnpm build
