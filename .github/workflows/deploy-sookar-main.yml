name: Deploy Sookar Main Safely
run-name: Build and review exact release ${{ inputs.target_sha || github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-sookar-main.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to build and review"
        required: true
        type: string
      deploy_to_server:
        description: "Deploy this exact reviewed commit to Sookar"
        required: true
        default: false
        type: boolean
      deploy_to_digibile:
        description: "Publish and activate the Digibile marketplace template on digibile.ir (separate from Sookar)"
        required: true
        default: false
        type: boolean
      requested_by:
        description: "Management panel requester"
        required: false
        type: string

concurrency:
  group: sookar-production-direct
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - name: Install API dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Verify platform integrity
        working-directory: .
        run: pnpm verify:platform
      - name: API build
        working-directory: apps/api
        run: pnpm build
      - name: Database migrations
        working-directory: apps/api
        run: pnpm migrate
      - name: API tests
        working-directory: apps/api
        run: pnpm test
      - name: Extract the original Digibile template
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=public/templates/marketplace-preview/marketplace-ui.zip
          test -s "$ARCHIVE"
          if unzip -Z1 "$ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path found in Digibile template."
            exit 1
          fi
          mkdir -p public/digibile-template
          unzip -oq "$ARCHIVE" -d public/digibile-template
          test -s public/digibile-template/src/index.html
          echo "DIGIBILE_TEMPLATE_EXTRACTED"
      - name: Web build
        working-directory: apps/web
        run: pnpm build
      - name: Package exact SHA
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' --exclude='*/.git' --exclude='**/.git' \
            --exclude='node_modules' --exclude='*/node_modules' --exclude='**/node_modules' \
            --exclude='.next' --exclude='*/.next' --exclude='**/.next' \
            --exclude='.cache' --exclude='*/.cache' --exclude='**/.cache' \
            --exclude='*.log' --exclude='**/*.log' \
            --exclude='.env' --exclude='.env.*' --exclude='*/.env' --exclude='*/.env.*' --exclude='**/.env' --exclude='**/.env.*' \
            --exclude='tmp' --exclude='*/tmp' --exclude='**/tmp' \
            --exclude='temp' --exclude='*/temp' --exclude='**/temp' \
            --exclude='backups' --exclude='*/backups' --exclude='**/backups' \
            --exclude='secrets' --exclude='*/secrets' --exclude='**/secrets' \
            --exclude='*.pem' --exclude='**/*.pem' --exclude='*.key' --exclude='**/*.key' \
            -czf /tmp/negar-platform.tar.gz .
          tar -tzf /tmp/negar-platform.tar.gz > /tmp/negar-platform-files.txt
          if grep -E '(^|/)(\.env([.]|$)|node_modules|\.next|\.cache|tmp|temp|backups|secrets)(/|$)|(^|/)(id_rsa|id_ed25519)([._-]|$)|\.(pem|key|log)$' /tmp/negar-platform-files.txt; then
            echo 'Forbidden environment, secret, cache, temporary, or backup content found in release package.'
            exit 1
          fi
          sha256sum /tmp/negar-platform.tar.gz | tee /tmp/negar-platform.tar.gz.sha256

      - name: Upload reviewable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: negar-platform-${{ inputs.target_sha || github.sha }}
          path: |
            /tmp/negar-platform.tar.gz
            /tmp/negar-platform.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare SSH
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.deploy_key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Preflight Sookar.ir production target
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
          test -f "$DOMAIN_CONF" || { echo "Sookar.ir DirectAdmin domain configuration is missing; deployment stopped."; exit 20; }
          test -d /home/sookar/domains/sookar.ir || { echo "Sookar.ir home directory is missing; deployment stopped."; exit 21; }
          test -f "$BASE/.env" || { echo "Sookar.ir production environment file is missing; no other domain environment will be copied."; exit 22; }
          test "$(stat -c %a "$BASE/.env")" = "600" || { echo "Sookar.ir environment permissions must be 600."; exit 23; }
          grep -Eq 'server_name[^;]*sookar\.ir' /usr/local/directadmin/data/users/sookar/nginx.conf || { echo "Sookar.ir has no generated Nginx server block; deployment stopped."; exit 24; }
          printf '' | openssl s_client -connect sookar.ir:443 -servername sookar.ir 2>/dev/null | openssl x509 -noout -checkend 86400 -checkhost sookar.ir
          echo SOOKAR_IR_PREFLIGHT_OK
          REMOTE

      - name: Upload release
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          scp -i ~/.deploy_key -P "$PORT" -o BatchMode=yes /tmp/negar-platform.tar.gz "$HOST:$BASE/negar-platform.tar.gz"
      - name: Deploy with rollback
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          SHA="$RELEASE_SHA"
          RELEASE="$BASE/releases/$SHA"
          CURRENT="$BASE/current"
          PREVIOUS="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          test -f "$BASE/.env"
          test "$(stat -c %a "$BASE/.env")" = "600"
          mkdir -p "$BASE/releases" "$RELEASE"
          rollback() {
            status=$?
            trap - ERR
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              cd "$PREVIOUS"
              docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans || true
              ln -sfn "$PREVIOUS" "$CURRENT"
            fi
            exit "$status"
          }
          trap rollback ERR
          tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
          cp "$BASE/.env" "$RELEASE/.env"
          chmod 600 "$RELEASE/.env"
          if grep -q '^PLATFORM_UPDATE_WORKFLOW=' "$RELEASE/.env"; then
            sed -i 's#^PLATFORM_UPDATE_WORKFLOW=.*#PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml#' "$RELEASE/.env"
          else
            printf 'PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml\n' >> "$RELEASE/.env"
          fi
          if grep -q '^DEPLOYED_SHA=' "$RELEASE/.env"; then
            sed -i "s#^DEPLOYED_SHA=.*#DEPLOYED_SHA=$SHA#" "$RELEASE/.env"
          else
            printf '\nDEPLOYED_SHA=%s\n' "$SHA" >> "$RELEASE/.env"
          fi
          cd "$RELEASE"
          docker compose -p naf-sookar -f docker-compose.production.yml config >/dev/null
          docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi
            [ "$i" = "45" ] && exit 1
            sleep 4
          done
          ln -sfn "$RELEASE" "$CURRENT"
          rm -f "$BASE/negar-platform.tar.gz"
          trap - ERR
          echo "DEPLOYED_SHA=$SHA"
          REMOTE
      - name: Production health and release check
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          curl -fsS http://127.0.0.1:4000/health >/dev/null
          test "$(readlink -f "$BASE/current")" = "$BASE/releases/$RELEASE_SHA"
          docker ps --format '{{.Names}}' | grep -Fx 'naf-sookar-api-1' >/dev/null
          echo PRODUCTION_DEPLOYMENT_OK
          REMOTE
      - name: Reload DirectAdmin Nginx configuration
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" '/usr/local/directadmin/custombuild/build rewrite_confs >/dev/null && nginx -t && systemctl reload nginx'

      - name: Configure DirectAdmin Nginx routes
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
          USER_NGINX=/usr/local/directadmin/data/users/sookar/nginx.conf
          test -f "$DOMAIN_CONF"
          cp -a "$DOMAIN_CONF" "$DOMAIN_CONF.before-platform"
          if [ -f "$USER_NGINX" ]; then cp -a "$USER_NGINX" "$USER_NGINX.before-platform"; fi
          /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          files = [
              Path("/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf"),
              Path("/usr/local/directadmin/data/users/sookar/nginx.conf"),
          ]

          def find_blocks(source, keyword):
              found = []
              pattern = re.compile(r"(?m)^\s*" + re.escape(keyword) + r"\b[^{]*\{")
              for match in pattern.finditer(source):
                  depth = 0
                  quote = None
                  escaped = False
                  for index in range(match.end() - 1, len(source)):
                      char = source[index]
                      if quote:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif char == quote:
                              quote = None
                          continue
                      if char in ("'", '"'):
                          quote = char
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              found.append((match.start(), index + 1))
                              break
              return found

          api = """    location ^~ /api/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://127.0.0.1:4000;
          }
          """
          root = """    location / {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://127.0.0.1:3100;
          }
          """

          patched = 0
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text()
              servers = [
                  block for block in find_blocks(source, "server")
                  if re.search(r"server_name\s+[^;]*\bsookar\.ir\b", source[block[0]:block[1]])
              ]
              if not servers:
                  continue
              pieces = []
              cursor = 0
              for begin, finish in servers:
                  pieces.append(source[cursor:begin])
                  block = source[begin:finish]
                  locations = find_blocks(block, "location")
                  remove = []
                  for la, lb in locations:
                      header = block[la:block.find("{", la)]
                      if re.search(r"location\s+(?:\^~\s+)?/\s*$", header.strip()) or re.search(r"location\s+\^~\s+/api/", header):
                          remove.append((la, lb))
                  for la, lb in reversed(remove):
                      block = block[:la] + block[lb:]
                  close = block.rfind("}")
                  block = block[:close] + api + root + block[close:]
                  pieces.append(block)
                  cursor = finish
                  patched += 1
              pieces.append(source[cursor:])
              path.write_text("".join(pieces))
              print("PATCHED", path, "server_blocks", len(servers))

          if patched == 0:
              raise SystemExit("No Sookar server block found in DirectAdmin domain or user Nginx configuration")
          subprocess.run(["nginx", "-t"], check=True)
          subprocess.run(["systemctl", "reload", "nginx"], check=True)
          print("NGINX_OK")
          PY
          REMOTE

      - name: Verify public HTTPS endpoint
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '' | openssl s_client -connect sookar.ir:443 -servername sookar.ir 2>/dev/null | openssl x509 -noout -checkend 86400 -checkhost sookar.ir
          for i in $(seq 1 10); do
            code=$(curl -L --connect-timeout 5 --max-time 10 -sS -o /tmp/sookar-ir-health.html -w '%{http_code}' https://sookar.ir/ || true)
            echo "PUBLIC_HTTP=$code attempt=$i"
            if [ "$code" = "200" ]; then
              echo PUBLIC_HTTPS_HEALTH_OK
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            head -c 1000 /tmp/sookar-ir-health.html || true
            exit 1
          fi
          grep -q 'digibile-template/src/index.html' /tmp/sookar-ir-health.html
          template_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-digibile-template.html -w '%{http_code}' https://sookar.ir/digibile-template/src/index.html)
          echo "DIGIBILE_TEMPLATE_HTTP=$template_code"
          test "$template_code" = "200"
          grep -qi '<html' /tmp/sookar-digibile-template.html
          echo "DIGIBILE_ROOT_TEMPLATE_OK"
          preview_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-marketplace-preview.html -w '%{http_code}' https://sookar.ir/store/marketplace-preview)
          echo "MARKETPLACE_PREVIEW_HTTP=$preview_code"
          test "$preview_code" = "200"
          grep -q "بازارگاه" /tmp/sookar-marketplace-preview.html
          legacy_preview_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-marketplace-preview-legacy.html -w '%{http_code}' https://sookar.ir/templates/marketplace-preview/index.html)
          echo "MARKETPLACE_PREVIEW_LEGACY_HTTP=$legacy_preview_code"
          test "$legacy_preview_code" = "200"
          grep -q "بازارگاه" /tmp/sookar-marketplace-preview-legacy.html
          echo "MARKETPLACE_PREVIEW_ROUTES_OK"

      - name: Verify live Sookar catalog and shopping flow
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          api_code=$(curl -L --connect-timeout 5 --max-time 30 -sS -o /tmp/sookar-public-catalog.json -w '%{http_code}' https://sookar.ir/api/public/marketplace)
          echo "PUBLIC_CATALOG_HTTP=$api_code"
          test "$api_code" = "200"
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/sookar-public-catalog.json","utf8"));
            const products=Array.isArray(d.products)?d.products:[];
            const productCategories=[...new Set(products.map(p=>p.category).filter(Boolean))];
            const categories=Array.isArray(d.categories)&&d.categories.length?d.categories:productCategories;
            const demo=products.filter(p=>p.is_demo_product===true);
            const images=products.filter(p=>typeof p.image_url==="string"&&p.image_url.length>0);
            const localImages=products.filter(p=>typeof p.image_url==="string"&&p.image_url.startsWith("/api/public/media/catalog/"));
            console.log("PUBLIC_CATALOG_TOTAL="+(d.total??products.length));
            console.log("PUBLIC_CATALOG_MODE="+(d.catalogMode??"owned"));
            console.log("DEMO_PRODUCT_COUNT="+demo.length);
            console.log("PRODUCT_CATEGORY_COUNT="+categories.length);
            console.log("PRODUCTS_WITH_IMAGES="+images.length);
            console.log("PRODUCTS_WITH_LOCAL_IMAGES="+localImages.length);
            console.log("FIRST_PRODUCT="+(products[0]?.title??"none"));
            console.log("FIRST_PRODUCT_SKU="+(products[0]?.sku??"none"));
            console.log("FIRST_PRODUCT_SOURCE="+(products[0]?.source_url??"none"));
            if(demo.length>0) throw new Error("Public catalog must not expose demo products; got "+demo.length);
            if(products.length>0 && categories.length<1) throw new Error("Products exist but no product categories were returned");
            if(products.length>0 && !products[0]?.sku) throw new Error("First product has no SKU");
            if(products.length>0 && images.length===0) console.warn("CATALOG_IMAGE_WARNING=No product images returned; check catalog media.");
            if(products.length===0) console.warn("CATALOG_EMPTY_WARNING=No real published products are available yet; storefront routes will be verified without inventing products.");
            fs.writeFileSync("/tmp/sookar-first-product-sku",products[0]?.sku||"");
          '
          sku=$(cat /tmp/sookar-first-product-sku)
          if [ -n "$sku" ]; then
            product_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-product-page.html -w '%{http_code}' "https://sookar.ir/store/product/${sku}?site=technolife")
            echo "PRODUCT_DETAIL_HTTP=$product_code"
            test "$product_code" = "200"
            grep -q "$sku" /tmp/sookar-product-page.html
          else
            echo "PRODUCT_DETAIL_SKIPPED_NO_REAL_PRODUCTS"
          fi
          cart_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-cart-page.html -w '%{http_code}' https://sookar.ir/store/cart)
          checkout_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-demo-checkout.html -w '%{http_code}' https://sookar.ir/store/demo-checkout)
          echo "CART_HTTP=$cart_code"
          echo "DEMO_CHECKOUT_HTTP=$checkout_code"
          test "$cart_code" = "200"
          test "$checkout_code" = "200"
          grep -q "سبد خرید" /tmp/sookar-cart-page.html
          grep -q "تکمیل خرید آزمایشی" /tmp/sookar-demo-checkout.html
          echo "SOOKAR_STOREFRONT_ROUTES_OK"

  publish-digibile-template:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_to_digibile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-digibile]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate and package Digibile template
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/public/templates/digibile-marketplace/index.html
          grep -q 'دیجی‌بایل' apps/web/public/templates/digibile-marketplace/index.html
          grep -q 'دسته‌بندی‌های محبوب' apps/web/public/templates/digibile-marketplace/index.html
          mkdir -p /tmp/digibile-template-package/digibile-marketplace/dist
          cp apps/web/public/templates/digibile-marketplace/index.html /tmp/digibile-template-package/digibile-marketplace/dist/index.html
          tar -czf /tmp/digibile-template.tar.gz -C /tmp/digibile-template-package digibile-marketplace
          sha256sum /tmp/digibile-template.tar.gz

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.deploy_key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify Digibile target before changing files
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i "$HOME/.deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DOMAIN=/home/digibile/domains/digibile.ir
          REGISTRY="$DOMAIN/ui/negar-templates"
          test -d "$DOMAIN/public_html" || { echo "Digibile document root missing; stopped."; exit 20; }
          test -d "$REGISTRY" || { echo "Digibile template registry missing; stopped."; exit 21; }
          test -f "$REGISTRY/templates.json" || { echo "Digibile templates.json missing; stopped."; exit 22; }
          test -f "$REGISTRY/active.json" || { echo "Digibile active.json missing; stopped."; exit 23; }
          test -f /usr/local/directadmin/data/users/digibile/domains/digibile.ir.conf || { echo "Digibile DirectAdmin domain config missing; stopped."; exit 24; }
          grep -Eq 'server_name[^;]*digibile\.ir' /usr/local/directadmin/data/users/digibile/nginx.conf || { echo "Digibile nginx server block not found; stopped."; exit 25; }
          SCRIPT="$(find "$DOMAIN/ui" "$DOMAIN" -maxdepth 4 -type f -name 'switch-template.sh' -print -quit 2>/dev/null || true)"
          test -n "$SCRIPT" || { echo "Template switch script not found; refusing to replace the live document root."; exit 26; }
          python3 - "$REGISTRY/templates.json" "$REGISTRY/active.json" <<'PY'
          import json,sys
          for path in sys.argv[1:]:
              with open(path,encoding="utf-8") as f: json.load(f)
          print("DIGIBILE_REGISTRY_JSON_OK")
          PY
          FREE_KB="$(df -Pk "$DOMAIN" | awk 'NR==2{print $4}')"
          PUBLIC_KB="$(du -sk "$DOMAIN/public_html" | awk '{print $1}')"
          test "$FREE_KB" -gt 2097152 || { echo "Less than 2 GiB free; no deployment performed."; exit 27; }
          test "$PUBLIC_KB" -lt 2097152 || { echo "Current document root exceeds safe backup limit; no deployment performed."; exit 28; }
          echo DIGIBILE_TARGET_PREFLIGHT_OK
          REMOTE

      - name: Upload Digibile template
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.deploy_key" -P "$DEPLOY_PORT" -o BatchMode=yes /tmp/digibile-template.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/digibile-template.tar.gz"

      - name: Register and activate on digibile.ir with rollback
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i "$HOME/.deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          DOMAIN=/home/digibile/domains/digibile.ir
          REGISTRY="$DOMAIN/ui/negar-templates"
          PUBLIC="$DOMAIN/public_html"
          ID=digibile-marketplace
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$DOMAIN/ui/backups/digibile-marketplace-$STAMP"
          SCRIPT="$(find "$DOMAIN/ui" "$DOMAIN" -maxdepth 4 -type f -name 'switch-template.sh' -print -quit)"
          mkdir -p "$BACKUP" "$REGISTRY/$ID"
          cp -a "$REGISTRY/templates.json" "$BACKUP/templates.json"
          cp -a "$REGISTRY/active.json" "$BACKUP/active.json"
          tar -czf "$BACKUP/public_html.tar.gz" -C "$PUBLIC" .
          python3 - "$REGISTRY/active.json" > "$BACKUP/previous-active-id" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: data=json.load(f)
          ids=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      key=k.lower().replace("-","_")
                      if key in ("id","template_id","templateid","active_template","active_template_id","activetemplateid") and isinstance(v,str) and v:
                          ids.append(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          print(ids[0] if ids else "")
          PY
          tar -xzf /tmp/digibile-template.tar.gz -C "$REGISTRY"
          chown -R digibile:digibile "$REGISTRY/$ID"
          python3 - "$REGISTRY/templates.json" "$ID" "$RELEASE_SHA" <<'PY'
          import json,sys,os,tempfile
          path,tid,sha=sys.argv[1:]
          with open(path,encoding="utf-8") as f: data=json.load(f)
          item={"id":tid,"template_id":tid,"slug":tid,"name":"دیجی‌بایل | بازارگاه حرفه‌ای","type":"marketplace","version":"1.0.0","description":"قالب فروشگاهی اختصاصی دیجی‌بایل؛ راست‌چین و واکنش‌گرا.","domain":"digibile.ir","dist":"digibile-marketplace/dist","path":"digibile-marketplace/dist","folder":"digibile-marketplace","entrypoint":"index.html","preview_url":"https://digibile.ir/","source_sha":sha,"status":"published"}
          if isinstance(data,list):
              data=[x for x in data if not (isinstance(x,dict) and (x.get("id")==tid or x.get("template_id")==tid or x.get("slug")==tid))]
              data.append(item)
          elif isinstance(data,dict):
              if isinstance(data.get("templates"),dict):
                  data["templates"][tid]=item
              else:
                  key=next((k for k in ("templates","items","records") if isinstance(data.get(k),list)),None)
                  if key:
                      data[key]=[x for x in data[key] if not (isinstance(x,dict) and (x.get("id")==tid or x.get("template_id")==tid or x.get("slug")==tid))]
                      data[key].append(item)
                  else:
                      data[tid]=item
          else: raise SystemExit("Unsupported templates.json structure; activation stopped.")
          fd,tmp=tempfile.mkstemp(prefix=".templates-",dir=os.path.dirname(path))
          with os.fdopen(fd,"w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write("\n")
          os.replace(tmp,path)
          PY
          chown digibile:digibile "$REGISTRY/templates.json"
          if ! "$SCRIPT" "$ID"; then
              echo "Activation command failed; restoring previous document root and registry."
              find "$PUBLIC" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              tar -xzf "$BACKUP/public_html.tar.gz" -C "$PUBLIC"
              cp -a "$BACKUP/templates.json" "$REGISTRY/templates.json"
              cp -a "$BACKUP/active.json" "$REGISTRY/active.json"
              exit 30
          fi
          code=000
          for i in $(seq 1 12); do
              code="$(curl -L --connect-timeout 5 --max-time 15 -sS -o /tmp/digibile-live-check.html -w '%{http_code}' https://digibile.ir/ || true)"
              if [ "$code" = "200" ] && grep -q 'دیجی‌بایل' /tmp/digibile-live-check.html && grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-live-check.html; then
                  echo DIGIBILE_LIVE_TEMPLATE_OK
                  break
              fi
              sleep 3
          done
          if [ "$code" != "200" ] || ! grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-live-check.html; then
              PREVIOUS="$(cat "$BACKUP/previous-active-id" 2>/dev/null || true)"
              if [ -n "$PREVIOUS" ] && [ -d "$REGISTRY/$PREVIOUS/dist" ]; then "$SCRIPT" "$PREVIOUS" || true; fi
              find "$PUBLIC" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              tar -xzf "$BACKUP/public_html.tar.gz" -C "$PUBLIC"
              cp -a "$BACKUP/templates.json" "$REGISTRY/templates.json"
              cp -a "$BACKUP/active.json" "$REGISTRY/active.json"
              echo "Live verification failed; rollback completed. Backup: $BACKUP"
              exit 31
          fi
          rm -f /tmp/digibile-template.tar.gz
          echo "DIGIBILE_TEMPLATE_REGISTERED=$ID"
          echo "DIGIBILE_TEMPLATE_SOURCE_SHA=$RELEASE_SHA"
          echo "DIGIBILE_BACKUP=$BACKUP"
          REMOTE

      - name: Verify Digibile public endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/digibile-final.html -w '%{http_code}' https://digibile.ir/)"
          echo "DIGIBILE_HTTP=$code"
          test "$code" = "200"
          grep -q 'دیجی‌بایل' /tmp/digibile-final.html
          grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-final.html
          echo DIGIBILE_PUBLIC_VERIFICATION_OK
