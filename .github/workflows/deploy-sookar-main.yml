name: Deploy Sookar Main Safely
run-name: Build and review exact release ${{ inputs.target_sha || github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "database/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-sookar-main.yml"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact commit SHA to build and review"
        required: true
        type: string
      deploy_to_server:
        description: "Deploy this exact reviewed commit to Sookar"
        required: true
        default: false
        type: boolean
      deploy_to_digibile:
        description: "Publish and activate the Digibile marketplace template on digibile.ir (separate from Sookar)"
        required: true
        default: false
        type: boolean
      requested_by:
        description: "Management panel requester"
        required: false
        type: string

concurrency:
  group: sookar-production-direct
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - name: Install API dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Verify platform integrity
        working-directory: .
        run: pnpm verify:platform
      - name: API build
        working-directory: apps/api
        run: pnpm build
      - name: Database migrations
        working-directory: apps/api
        run: pnpm migrate
      - name: API tests
        working-directory: apps/api
        run: pnpm test
      - name: Extract the original Digibile template
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=public/templates/marketplace-preview/marketplace-ui.zip
          test -s "$ARCHIVE"
          if unzip -Z1 "$ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path found in Digibile template."
            exit 1
          fi
          mkdir -p public/digibile-template
          unzip -oq "$ARCHIVE" -d public/digibile-template
          test -s public/digibile-template/src/index.html
          echo "DIGIBILE_TEMPLATE_EXTRACTED"
      - name: Validate Digibile storefront category interactions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync("public/templates/digibile-marketplace/index.html", "utf8");
          const required = [
            ["normalized category regex", String.raw`replace(/[\s\u200c\-_]/g,"")`],
            ["PC word boundary regex", String.raw`|\bpc\b|`],
            ["category click binding", 'document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>setFilter(b.dataset.category))'],
            ["mobile category navigation", 'action==="categories"'],
            ["homepage category merchandising", "function renderHomeSections()"],
            ["verified special-offer section", "فروش ویژه و تخفیف‌خورده‌ها"],
            ["discount data validation", "Number(p.discount_percent)>0"],
            ["reference products are not purchasable", 'sourceStatus==="unavailable"||sourceStatus==="reference"||p.source_available===false'],
            ["reference inventory is not fabricated", 'stock_quantity:catalogMode==="reference"?0'],
            ["reference product disclosure", "فروشنده هنوز عرضه نکرده"]
          ];
          for (const [label, snippet] of required) {
            if (!source.includes(snippet)) throw new Error("Digibile storefront check failed: " + label);
          }
          if (source.includes(String.raw`replace(/[\\s\\u200c\\-_]/g,"")`)) {
            throw new Error("Category normalization regex is double-escaped.");
          }
          if (source.includes("موجودی موقت ۱۰") || source.includes("p.discount??") || source.includes("??10")) {
            throw new Error("Reference inventory or discount fallback is misleading.");
          }
          const compact = s => String(s ?? "").replace(/[ي]/g,"ی").replace(/[ك]/g,"ک").replace(/[\s\u200c\-_]/g,"").toLocaleLowerCase("fa-IR");
          for (const [a,b] of [["لپ تاپ","لپ‌تاپ"],["موبایل و دیجیتال","موبایل-و-دیجیتال"],["PC","pc"]]) {
            if (compact(a) !== compact(b)) throw new Error("Category normalization fixture failed: " + a + " / " + b);
          }
          console.log("DIGIBILE_STOREFRONT_INTERACTIONS_STATIC_CHECK_OK");
          NODE
      - name: Test deployment-time Digibile product shelves with saved-data fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          workflow = pathlib.Path(".github/workflows/deploy-sookar-main.yml").read_text(encoding="utf-8")
          marker = workflow.index("# Render real saved products, category shelves, and verified discounts into HTML at deployment time.")
          heredoc = workflow.index("python3 - <<'PY'\n", marker) + len("python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n          grep -q 'data-static-fallback", heredoc)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow[heredoc:end].splitlines())
          compile(script, "digibile-static-renderer.py", "exec")
          base = pathlib.Path("/tmp/digibile-template-package/digibile-marketplace/dist")
          base.mkdir(parents=True, exist_ok=True)
          (base / "catalog.json").write_text(json.dumps({
              "tenant": {"code": "digibile"},
              "categories": [],
              "products": [
                  {"title": "گوشی موبایل آیفون", "category": "موبایل و دیجیتال", "price": 1000000, "original_price": 1200000, "image_url": "https://example.invalid/phone.jpg"},
                  {"title": "لپ تاپ Lenovo", "category": "لپ‌تاپ و کامپیوتر", "price": 2000000, "image_url": "https://example.invalid/laptop.jpg"},
                  {"title": "یخچال خانه", "category": "خانه و آشپزخانه", "price": 5000000, "image_url": "https://example.invalid/fridge.jpg"}
              ]
          }, ensure_ascii=False), encoding="utf-8")
          (base / "index.html").write_text('<div class="grid" id="productGrid"></div><div id="homeMerchandisingGrid"></div>', encoding="utf-8")
          exec(compile(script, "digibile-static-renderer.py", "exec"), {})
          rendered = (base / "index.html").read_text(encoding="utf-8")
          for label in ('data-static-fallback="true"', "فروش ویژه و تخفیف‌خورده‌ها", "موبایل و دیجیتال", "لپ‌تاپ و کامپیوتر", "خانه و آشپزخانه", "فهرست مرجع؛ عرضه و موجودی فروشنده تأیید نشده", "٪17 تخفیف معتبر"):
              if label not in rendered:
                  raise SystemExit("Static Digibile shelf fixture missing: " + label)
          if "فروشنده هنوز عرضه نکرده" in rendered:
              raise SystemExit("Unexpected purchasable seller label in static reference fixture")
          print("DIGIBILE_STATIC_SHELVES_FIXTURE_OK")
          PY
      - name: Web build
        working-directory: apps/web
        run: pnpm build
      - name: Package exact SHA
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' --exclude='*/.git' --exclude='**/.git' \
            --exclude='node_modules' --exclude='*/node_modules' --exclude='**/node_modules' \
            --exclude='.next' --exclude='*/.next' --exclude='**/.next' \
            --exclude='.cache' --exclude='*/.cache' --exclude='**/.cache' \
            --exclude='*.log' --exclude='**/*.log' \
            --exclude='.env' --exclude='.env.*' --exclude='*/.env' --exclude='*/.env.*' --exclude='**/.env' --exclude='**/.env.*' \
            --exclude='tmp' --exclude='*/tmp' --exclude='**/tmp' \
            --exclude='temp' --exclude='*/temp' --exclude='**/temp' \
            --exclude='backups' --exclude='*/backups' --exclude='**/backups' \
            --exclude='secrets' --exclude='*/secrets' --exclude='**/secrets' \
            --exclude='*.pem' --exclude='**/*.pem' --exclude='*.key' --exclude='**/*.key' \
            -czf /tmp/negar-platform.tar.gz .
          tar -tzf /tmp/negar-platform.tar.gz > /tmp/negar-platform-files.txt
          if grep -E '(^|/)(\.env([.]|$)|node_modules|\.next|\.cache|tmp|temp|backups|secrets)(/|$)|(^|/)(id_rsa|id_ed25519)([._-]|$)|\.(pem|key|log)$' /tmp/negar-platform-files.txt; then
            echo 'Forbidden environment, secret, cache, temporary, or backup content found in release package.'
            exit 1
          fi
          sha256sum /tmp/negar-platform.tar.gz | tee /tmp/negar-platform.tar.gz.sha256

      - name: Upload reviewable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: negar-platform-${{ inputs.target_sha || github.sha }}
          path: |
            /tmp/negar-platform.tar.gz
            /tmp/negar-platform.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare SSH
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.deploy_key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Preflight Sookar.ir production target
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
          test -f "$DOMAIN_CONF" || { echo "Sookar.ir DirectAdmin domain configuration is missing; deployment stopped."; exit 20; }
          test -d /home/sookar/domains/sookar.ir || { echo "Sookar.ir home directory is missing; deployment stopped."; exit 21; }
          test -f "$BASE/.env" || { echo "Sookar.ir production environment file is missing; no other domain environment will be copied."; exit 22; }
          test "$(stat -c %a "$BASE/.env")" = "600" || { echo "Sookar.ir environment permissions must be 600."; exit 23; }
          grep -Eq 'server_name[^;]*sookar\.ir' /usr/local/directadmin/data/users/sookar/nginx.conf || { echo "Sookar.ir has no generated Nginx server block; deployment stopped."; exit 24; }
          printf '' | openssl s_client -connect sookar.ir:443 -servername sookar.ir 2>/dev/null | openssl x509 -noout -checkend 86400 -checkhost sookar.ir
          echo SOOKAR_IR_PREFLIGHT_OK
          REMOTE

      - name: Upload release
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          scp -i ~/.deploy_key -P "$PORT" -o BatchMode=yes /tmp/negar-platform.tar.gz "$HOST:$BASE/negar-platform.tar.gz"
      - name: Deploy with rollback
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          SHA="$RELEASE_SHA"
          RELEASE="$BASE/releases/$SHA"
          CURRENT="$BASE/current"
          PREVIOUS="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          test -f "$BASE/.env"
          test "$(stat -c %a "$BASE/.env")" = "600"
          mkdir -p "$BASE/releases" "$RELEASE"
          rollback() {
            status=$?
            trap - ERR
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              cd "$PREVIOUS"
              docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans || true
              ln -sfn "$PREVIOUS" "$CURRENT"
            fi
            exit "$status"
          }
          trap rollback ERR
          tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
          cp "$BASE/.env" "$RELEASE/.env"
          chmod 600 "$RELEASE/.env"
          if grep -q '^PLATFORM_UPDATE_WORKFLOW=' "$RELEASE/.env"; then
            sed -i 's#^PLATFORM_UPDATE_WORKFLOW=.*#PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml#' "$RELEASE/.env"
          else
            printf 'PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml\n' >> "$RELEASE/.env"
          fi
          if grep -q '^DEPLOYED_SHA=' "$RELEASE/.env"; then
            sed -i "s#^DEPLOYED_SHA=.*#DEPLOYED_SHA=$SHA#" "$RELEASE/.env"
          else
            printf '\nDEPLOYED_SHA=%s\n' "$SHA" >> "$RELEASE/.env"
          fi
          cd "$RELEASE"
          docker compose -p naf-sookar -f docker-compose.production.yml config >/dev/null
          docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi
            [ "$i" = "45" ] && exit 1
            sleep 4
          done
          ln -sfn "$RELEASE" "$CURRENT"
          rm -f "$BASE/negar-platform.tar.gz"
          trap - ERR
          echo "DEPLOYED_SHA=$SHA"
          REMOTE
      - name: Production health and release check
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          curl -fsS http://127.0.0.1:4000/health >/dev/null
          test "$(readlink -f "$BASE/current")" = "$BASE/releases/$RELEASE_SHA"
          docker ps --format '{{.Names}}' | grep -Fx 'naf-sookar-api-1' >/dev/null
          echo PRODUCTION_DEPLOYMENT_OK
          REMOTE
      - name: Reload DirectAdmin Nginx configuration
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" '/usr/local/directadmin/custombuild/build rewrite_confs >/dev/null && nginx -t && systemctl reload nginx'

      - name: Configure DirectAdmin Nginx routes
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
          USER_NGINX=/usr/local/directadmin/data/users/sookar/nginx.conf
          test -f "$DOMAIN_CONF"
          cp -a "$DOMAIN_CONF" "$DOMAIN_CONF.before-platform"
          if [ -f "$USER_NGINX" ]; then cp -a "$USER_NGINX" "$USER_NGINX.before-platform"; fi
          /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          files = [
              Path("/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf"),
              Path("/usr/local/directadmin/data/users/sookar/nginx.conf"),
          ]

          def find_blocks(source, keyword):
              found = []
              pattern = re.compile(r"(?m)^\s*" + re.escape(keyword) + r"\b[^{]*\{")
              for match in pattern.finditer(source):
                  depth = 0
                  quote = None
                  escaped = False
                  for index in range(match.end() - 1, len(source)):
                      char = source[index]
                      if quote:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif char == quote:
                              quote = None
                          continue
                      if char in ("'", '"'):
                          quote = char
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              found.append((match.start(), index + 1))
                              break
              return found

          api = """    location ^~ /api/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://127.0.0.1:4000;
          }
          """
          root = """    location / {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://127.0.0.1:3100;
          }
          """

          patched = 0
          for path in files:
              if not path.exists():
                  continue
              source = path.read_text()
              servers = [
                  block for block in find_blocks(source, "server")
                  if re.search(r"server_name\s+[^;]*\bsookar\.ir\b", source[block[0]:block[1]])
              ]
              if not servers:
                  continue
              pieces = []
              cursor = 0
              for begin, finish in servers:
                  pieces.append(source[cursor:begin])
                  block = source[begin:finish]
                  locations = find_blocks(block, "location")
                  remove = []
                  for la, lb in locations:
                      header = block[la:block.find("{", la)]
                      if re.search(r"location\s+(?:\^~\s+)?/\s*$", header.strip()) or re.search(r"location\s+\^~\s+/api/", header):
                          remove.append((la, lb))
                  for la, lb in reversed(remove):
                      block = block[:la] + block[lb:]
                  close = block.rfind("}")
                  block = block[:close] + api + root + block[close:]
                  pieces.append(block)
                  cursor = finish
                  patched += 1
              pieces.append(source[cursor:])
              path.write_text("".join(pieces))
              print("PATCHED", path, "server_blocks", len(servers))

          if patched == 0:
              raise SystemExit("No Sookar server block found in DirectAdmin domain or user Nginx configuration")
          subprocess.run(["nginx", "-t"], check=True)
          subprocess.run(["systemctl", "reload", "nginx"], check=True)
          print("NGINX_OK")
          PY
          REMOTE

      - name: Verify public HTTPS endpoint
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '' | openssl s_client -connect sookar.ir:443 -servername sookar.ir 2>/dev/null | openssl x509 -noout -checkend 86400 -checkhost sookar.ir
          for i in $(seq 1 10); do
            code=$(curl -L --connect-timeout 5 --max-time 10 -sS -o /tmp/sookar-ir-health.html -w '%{http_code}' https://sookar.ir/ || true)
            echo "PUBLIC_HTTP=$code attempt=$i"
            if [ "$code" = "200" ]; then
              echo PUBLIC_HTTPS_HEALTH_OK
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            head -c 1000 /tmp/sookar-ir-health.html || true
            exit 1
          fi
          grep -q 'sk-store--marketplace-pro' /tmp/sookar-ir-health.html
          template_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-digibile-template.html -w '%{http_code}' https://sookar.ir/digibile-template/src/index.html)
          echo "DIGIBILE_TEMPLATE_HTTP=$template_code"
          test "$template_code" = "200"
          grep -qi '<html' /tmp/sookar-digibile-template.html
          echo "DIGIBILE_ROOT_TEMPLATE_OK"
          preview_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-marketplace-preview.html -w '%{http_code}' https://sookar.ir/store/marketplace-preview)
          echo "MARKETPLACE_PREVIEW_HTTP=$preview_code"
          test "$preview_code" = "200"
          grep -q "بازارگاه" /tmp/sookar-marketplace-preview.html
          legacy_preview_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-marketplace-preview-legacy.html -w '%{http_code}' https://sookar.ir/templates/marketplace-preview/index.html)
          echo "MARKETPLACE_PREVIEW_LEGACY_HTTP=$legacy_preview_code"
          test "$legacy_preview_code" = "200"
          grep -q "بازارگاه" /tmp/sookar-marketplace-preview-legacy.html
          echo "MARKETPLACE_PREVIEW_ROUTES_OK"

      - name: Verify shared login and customer registration endpoints
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          for path in 'login?brand=digibile' 'register?brand=digibile'; do
            code="$(curl -L --connect-timeout 5 --max-time 25 -sS -o /tmp/auth-page.html -w '%{http_code}' "https://sookar.ir/$path")"
            echo "AUTH_PAGE_HTTP=$code"
            test "$code" = "200"
            grep -qi '<html' /tmp/auth-page.html
          done
          challenge_code="$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/auth-challenge.json -w '%{http_code}' https://sookar.ir/api/auth/human-check)"
          echo "AUTH_HUMAN_CHECK_HTTP=$challenge_code"
          test "$challenge_code" = "200"
          node -e 'const d=require("/tmp/auth-challenge.json");if(!d.challenge||!d.question)process.exit(1);console.log("AUTH_HUMAN_CHECK_OK")'
          register_code="$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/auth-register-validation.json -w '%{http_code}' -H 'content-type: application/json' -d '{}' https://sookar.ir/api/auth/register)"
          echo "AUTH_REGISTER_VALIDATION_HTTP=$register_code"
          test "$register_code" = "400"
          node -e 'const d=require("/tmp/auth-register-validation.json");if(!d.error)process.exit(1);console.log("AUTH_REGISTER_ROUTE_OK")'
          echo "AUTH_LOGIN_REGISTER_ENDPOINTS_OK"

      - name: Verify live Sookar catalog and shopping flow
        if: ${{ inputs.deploy_to_server || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-sookar]')) }}
        shell: bash
        run: |
          set -euo pipefail
          api_code=$(curl -L --connect-timeout 5 --max-time 30 -sS -o /tmp/sookar-public-catalog.json -w '%{http_code}' https://sookar.ir/api/public/marketplace)
          echo "PUBLIC_CATALOG_HTTP=$api_code"
          test "$api_code" = "200"
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/sookar-public-catalog.json","utf8"));
            const products=Array.isArray(d.products)?d.products:[];
            const productCategories=[...new Set(products.map(p=>p.category).filter(Boolean))];
            const categories=Array.isArray(d.categories)&&d.categories.length?d.categories:productCategories;
            const demo=products.filter(p=>p.is_demo_product===true);
            const images=products.filter(p=>typeof p.image_url==="string"&&p.image_url.length>0);
            const localImages=products.filter(p=>typeof p.image_url==="string"&&p.image_url.startsWith("/api/public/media/catalog/"));
            console.log("PUBLIC_CATALOG_TOTAL="+(d.total??products.length));
            console.log("PUBLIC_CATALOG_MODE="+(d.catalogMode??"owned"));
            console.log("DEMO_PRODUCT_COUNT="+demo.length);
            console.log("PRODUCT_CATEGORY_COUNT="+categories.length);
            console.log("PRODUCTS_WITH_IMAGES="+images.length);
            console.log("PRODUCTS_WITH_LOCAL_IMAGES="+localImages.length);
            console.log("FIRST_PRODUCT="+(products[0]?.title??"none"));
            console.log("FIRST_PRODUCT_SKU="+(products[0]?.sku??"none"));
            console.log("FIRST_PRODUCT_SOURCE="+(products[0]?.source_url??"none"));
            if(demo.length>0) throw new Error("Public catalog must not expose demo products; got "+demo.length);
            if(products.length>0 && categories.length<1) throw new Error("Products exist but no product categories were returned");
            if(products.length>0 && !products[0]?.sku) throw new Error("First product has no SKU");
            if(products.length>0 && images.length===0) console.warn("CATALOG_IMAGE_WARNING=No product images returned; check catalog media.");
            if(products.length===0) console.warn("CATALOG_EMPTY_WARNING=No real published products are available yet; storefront routes will be verified without inventing products.");
            fs.writeFileSync("/tmp/sookar-first-product-sku",products[0]?.sku||"");
          '
          sku=$(cat /tmp/sookar-first-product-sku)
          if [ -n "$sku" ]; then
            product_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-product-page.html -w '%{http_code}' "https://sookar.ir/store/product/${sku}?site=marketplace-pro")
            echo "PRODUCT_DETAIL_HTTP=$product_code"
            test "$product_code" = "200"
            grep -q "$sku" /tmp/sookar-product-page.html
          else
            echo "PRODUCT_DETAIL_SKIPPED_NO_REAL_PRODUCTS"
          fi
          cart_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-cart-page.html -w '%{http_code}' https://sookar.ir/store/cart)
          checkout_code=$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/sookar-demo-checkout.html -w '%{http_code}' https://sookar.ir/store/demo-checkout)
          echo "CART_HTTP=$cart_code"
          echo "DEMO_CHECKOUT_HTTP=$checkout_code"
          test "$cart_code" = "200"
          test "$checkout_code" = "200"
          grep -q "سبد خرید" /tmp/sookar-cart-page.html
          grep -q "تکمیل خرید آزمایشی" /tmp/sookar-demo-checkout.html
          echo "SOOKAR_STOREFRONT_ROUTES_OK"

  publish-digibile-template:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_to_digibile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-digibile]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Validate and package Digibile template
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/web/public/templates/digibile-marketplace/index.html
          grep -q 'دیجی‌بایل' apps/web/public/templates/digibile-marketplace/index.html
          grep -q 'دسته‌بندی‌های محبوب' apps/web/public/templates/digibile-marketplace/index.html
          mkdir -p /tmp/digibile-template-package/digibile-marketplace/dist
          # Freeze the already-persisted database catalog into the storefront release.
          # This is a deployment-time import, not a runtime dependency on the source API.
          curl -fSs --connect-timeout 10 --max-time 150 'https://sookar.ir/api/public/marketplace/reference-catalog?tenantCode=digibile' -o /tmp/digibile-template-package/digibile-marketplace/dist/catalog.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/digibile-template-package/digibile-marketplace/dist/catalog.json","utf8"));const p=Array.isArray(d.products)?d.products:[];const priced=p.filter(x=>Number(x.price)>0);console.log("DIGIBILE_STATIC_CATALOG_PRODUCTS="+p.length);console.log("DIGIBILE_STATIC_CATALOG_PRICED="+priced.length);if(d.tenant?.code!=="digibile"||priced.length===0)process.exit(1);'
          cp apps/web/public/templates/digibile-marketplace/index.html /tmp/digibile-template-package/digibile-marketplace/dist/index.html
          # Render real saved products, category shelves, and verified discounts into HTML at deployment time.
          # This gives the homepage meaningful product sections before JavaScript starts and keeps the reference inventory honest.
          python3 - <<'PY'
          import html, json, pathlib, re
          catalog_path = pathlib.Path("/tmp/digibile-template-package/digibile-marketplace/dist/catalog.json")
          index_path = pathlib.Path("/tmp/digibile-template-package/digibile-marketplace/dist/index.html")
          data = json.loads(catalog_path.read_text(encoding="utf-8"))
          products = data.get("products", [])
          category_rows = data.get("categories", []) if isinstance(data.get("categories", []), list) else []
          category_by_id = {}
          for row in category_rows:
              if not isinstance(row, dict):
                  continue
              label = row.get("name") or row.get("title") or row.get("label") or row.get("category_name") or row.get("categoryName") or row.get("slug")
              if label:
                  for key in (row.get("id"), row.get("category_id"), row.get("categoryId"), row.get("slug")):
                      if key is not None:
                          category_by_id[str(key)] = str(label)
          def esc(value):
              return html.escape(str(value if value is not None else ""), quote=True)
          def number(value):
              if value is None:
                  return 0.0
              text = str(value).translate(str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789"))
              text = re.sub(r"[٬،,\sتومانریال﷼$€]", "", text)
              text = re.sub(r"[^0-9.\-]", "", text)
              try:
                  return float(text)
              except (TypeError, ValueError):
                  return 0.0
          def first_value(item, keys, fallback=None):
              for key in keys:
                  value = item.get(key)
                  if value is not None and value != "":
                      return value
              return fallback
          def as_text(value):
              if isinstance(value, list):
                  return " ".join(as_text(v) for v in value)
              if isinstance(value, dict):
                  return str(value.get("name") or value.get("title") or value.get("label") or value.get("slug") or category_by_id.get(str(value.get("id") or value.get("category_id") or value.get("categoryId") or ""), ""))
              return str(value or "")
          taxonomy = [
              ("موبایل و دیجیتال", r"موبایل|گوشی|تلفن همراه|smart.?phone|mobile|tablet|تبلت|iphone|آیفون|ipad|آیپد|galaxy|گلکسی|redmi|ردمی|poco|پوکو|pixel phone"),
              ("لپ‌تاپ و کامپیوتر", r"لپ.?تاپ|laptop|notebook|macbook|مک.?بوک|thinkpad|vivobook|ideapad|chromebook|کامپیوتر|computer|desktop|pc|ultrabook|mini.?pc"),
              ("خانه و آشپزخانه", r"خانه|آشپزخانه|یخچال|جاروبرقی|مبلمان|home appliance|kitchen|microwave|ظرفشویی|اجاق"),
              ("ساعت و اکسسوری", r"ساعت|اکسسوری|watch|bracelet|جواهر|زیور|smart.?watch"),
              ("مد و پوشاک", r"پوشاک|لباس|کفش|fashion|clothing|apparel|shoes|sneaker|مانتو|شلوار"),
              ("زیبایی و سلامت", r"زیبایی|سلامت|آرایشی|بهداشتی|beauty|health|skincare|عطر|ادکلن"),
              ("ورزش و سفر", r"ورزش|سفر|camping|sport|travel|دوچرخه|کوهنوردی"),
              ("خودرو و ابزار", r"خودرو|ابزار|automotive|tool|لوازم یدکی|موتور سیکلت|موتورسیکلت"),
          ]
          def normalize_product(raw, index):
              if not isinstance(raw, dict):
                  return None
              attrs = raw.get("attributes") if isinstance(raw.get("attributes"), dict) else {}
              title = first_value(raw, ("title", "name", "product_title", "productTitle", "product_name", "productName", "label", "display_name"), first_value(attrs, ("title", "name"), "کالای " + str(index + 1)))
              price = number(first_value(raw, ("price", "sale_price", "salePrice", "final_price", "finalPrice", "discounted_price", "discountedPrice", "current_price", "currentPrice", "selling_price", "sellingPrice", "amount"), first_value(attrs, ("price", "sale_price", "salePrice", "final_price"), 0)))
              original = number(first_value(raw, ("original_price", "originalPrice", "regular_price", "regularPrice", "list_price", "listPrice", "compare_at_price", "compareAtPrice", "old_price", "oldPrice", "mrp"), first_value(attrs, ("original_price", "originalPrice", "regular_price"), 0)))
              raw_image = first_value(raw, ("image_url", "imageUrl", "image", "thumbnail_url", "thumbnail", "main_image", "mainImage"), first_value(attrs, ("image_url", "imageUrl"), ""))
              if isinstance(raw_image, list):
                  raw_image = raw_image[0] if raw_image else ""
              if isinstance(raw_image, dict):
                  raw_image = raw_image.get("url") or raw_image.get("src") or raw_image.get("original") or ""
              image = str(raw_image or "")
              if image and not image.startswith("http"):
                  image = "https://sookar.ir/" + image.lstrip("/")
              raw_category = first_value(raw, ("category", "category_name", "categoryName", "category_title", "categoryTitle", "category_path", "categoryPath", "product_type", "productType", "categories", "category_id", "categoryId", "primary_category_id", "primaryCategoryId", "category_ids", "categoryIds"), first_value(attrs, ("category", "category_name", "categories", "category_id", "categoryId"), ""))
              category_text = category_by_id.get(str(raw_category), "") if not isinstance(raw_category, (dict, list)) else as_text(raw_category)
              if not category_text:
                  category_text = as_text(raw_category)
              searchable = " ".join(str(x or "") for x in (title, category_text, raw.get("brand"), raw.get("description"), raw.get("short_description")))
              normalized = searchable.replace("ي", "ی").replace("ك", "ک").lower()
              category = next((name for name, pattern in taxonomy if re.search(pattern, normalized, re.I)), category_text or "سایر کالاها")
              raw_discount = first_value(raw, ("discount_percent", "discountPercent", "discount_percentage", "discountPercentage", "discount_rate", "discountRate"), first_value(attrs, ("discount_percent", "discountPercent", "discount_rate"), 0))
              discount_value = number(raw_discount)
              discount = min(100, round(discount_value if discount_value > 1 else discount_value * 100)) if discount_value > 0 else (round((original-price)/original*100) if original > price > 0 else 0)
              return {"title": str(title), "price": price, "original": original, "discount": discount, "image": image, "category": category, "raw": raw}
          normalized_products = [p for i, raw in enumerate(products) if (p := normalize_product(raw, i)) and p["title"] and p["image"] and p["price"] > 0]
          def card(p):
              discount = p["discount"]
              tag = "٪" + str(discount) + " تخفیف معتبر" if discount > 0 else "کالای ذخیره‌شده"
              old_price = '<small style="text-decoration:line-through">' + esc(format(round(p["original"]/10), ",") + " تومان") + '</small>' if p["original"] > p["price"] else ""
              return '<article class="card"><div class="photo"><span class="tag">' + esc(tag) + '</span><img loading="lazy" alt="' + esc(p["title"]) + '" src="' + esc(p["image"]) + '"></div><div class="pinfo"><span class="cat">' + esc(p["category"]) + '</span><h3>' + esc(p["title"]) + '</h3><div class="pfoot"><div>' + old_price + '<strong>' + esc(format(round(p["price"]/10), ",")) + ' تومان</strong><small>فهرست مرجع؛ عرضه و موجودی فروشنده تأیید نشده</small></div></div></div></article>'
          cards = [card(p) for p in normalized_products[:24]]
          if not cards:
              raise SystemExit("No valid saved products can be rendered into the storefront HTML")
          shelves = []
          offers = [p for p in normalized_products if p["discount"] > 0 or p["original"] > p["price"]]
          shelf_groups = [("موبایل و دیجیتال", [p for p in normalized_products if p["category"] == "موبایل و دیجیتال"]), ("لپ‌تاپ و کامپیوتر", [p for p in normalized_products if p["category"] == "لپ‌تاپ و کامپیوتر"]), ("خانه و آشپزخانه", [p for p in normalized_products if p["category"] == "خانه و آشپزخانه"]), ("ساعت و اکسسوری", [p for p in normalized_products if p["category"] == "ساعت و اکسسوری"])]
          shelf_groups.insert(0, ("فروش ویژه و تخفیف‌خورده‌ها", offers))
          for title, items in shelf_groups:
              if items:
                  shelves.append('<section class="section home-product-section"><div class="sectionhead"><div><span class="kicker">' + ("پیشنهادهای تخفیف" if title.startswith("فروش ویژه") else "دسته‌بندی محصولات") + '</span><h2>' + esc(title) + '</h2><p>' + ("فقط تخفیف‌های دارای دادهٔ ثبت‌شده؛ بدون قیمت‌سازی." if title.startswith("فروش ویژه") else "کالاهای ذخیره‌شده در این دسته، با وضعیت عرضهٔ شفاف.") + '</p></div><a class="textlink" href="#products">مشاهده همه ←</a></div><div class="grid">' + "".join(card(p) for p in items[:8]) + '</div></section>')
              elif title.startswith("فروش ویژه"):
                  shelves.append('<section class="section home-product-section"><div class="sectionhead"><div><span class="kicker">پیشنهادهای تخفیف</span><h2>' + esc(title) + '</h2><p>فقط تخفیف‌های دارای دادهٔ ثبت‌شده؛ بدون قیمت‌سازی.</p></div></div><div class="empty">در فهرست ذخیره‌شده هنوز تخفیف معتبر ثبت نشده است؛ برای نمایش تخفیف ساختگی نمی‌سازیم.</div></section>')
          source = index_path.read_text(encoding="utf-8")
          grid_placeholder = '<div class="grid" id="productGrid"></div>'
          if grid_placeholder not in source:
              raise SystemExit("Storefront product grid placeholder not found")
          source = source.replace(grid_placeholder, '<div class="grid" id="productGrid" data-static-fallback="true">' + ''.join(cards) + '</div>', 1)
          shelf_placeholder = '<div id="homeMerchandisingGrid"></div>'
          if shelf_placeholder not in source:
              raise SystemExit("Storefront homepage merchandising placeholder not found")
          source = source.replace(shelf_placeholder, '<div id="homeMerchandisingGrid">' + ''.join(shelves) + '</div>', 1)
          index_path.write_text(source, encoding="utf-8")
          print("DIGIBILE_STATIC_RENDERED_CARDS=" + str(len(cards)))
          print("DIGIBILE_STATIC_CATEGORY_SECTIONS=" + str(sum(1 for title, items in shelf_groups if items)))
          print("DIGIBILE_STATIC_SALE_PRODUCTS=" + str(len(offers)))
          print("DIGIBILE_STATIC_SHELVES_RENDERED=" + str(len(shelves)))
          PY
          grep -q 'data-static-fallback="true"' /tmp/digibile-template-package/digibile-marketplace/dist/index.html
          grep -q 'id="homeMerchandisingGrid">' /tmp/digibile-template-package/digibile-marketplace/dist/index.html
          grep -q 'فهرست مرجع؛ عرضه و موجودی فروشنده تأیید نشده' /tmp/digibile-template-package/digibile-marketplace/dist/index.html
          echo DIGIBILE_STATIC_PRODUCT_HTML_OK
          echo DIGIBILE_STATIC_PRODUCT_HTML_OK
          tar -czf /tmp/digibile-template.tar.gz -C /tmp/digibile-template-package digibile-marketplace
          sha256sum /tmp/digibile-template.tar.gz

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.deploy_key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify Digibile target before changing files
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i "$HOME/.deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DOMAIN=/home/digibile/domains/digibile.ir
          REGISTRY="$DOMAIN/ui/negar-templates"
          test -d "$DOMAIN/public_html" || { echo "Digibile document root missing; stopped."; exit 20; }
          test -d "$REGISTRY" || { echo "Digibile template registry missing; stopped."; exit 21; }
          test -f "$REGISTRY/templates.json" || { echo "Digibile templates.json missing; stopped."; exit 22; }
          test -f "$REGISTRY/active.json" || { echo "Digibile active.json missing; stopped."; exit 23; }
          test -f /usr/local/directadmin/data/users/digibile/domains/digibile.ir.conf || { echo "Digibile DirectAdmin domain config missing; stopped."; exit 24; }
          grep -Eq 'server_name[^;]*digibile\.ir' /usr/local/directadmin/data/users/digibile/nginx.conf || { echo "Digibile nginx server block not found; stopped."; exit 25; }
          SCRIPT="$(find "$DOMAIN/ui" "$DOMAIN" -maxdepth 4 -type f -name 'switch-template.sh' -print -quit 2>/dev/null || true)"
          test -n "$SCRIPT" || { echo "Template switch script not found; refusing to replace the live document root."; exit 26; }
          python3 - "$REGISTRY/templates.json" "$REGISTRY/active.json" <<'PY'
          import json,sys
          for path in sys.argv[1:]:
              with open(path,encoding="utf-8") as f: json.load(f)
          print("DIGIBILE_REGISTRY_JSON_OK")
          PY
          FREE_KB="$(df -Pk "$DOMAIN" | awk 'NR==2{print $4}')"
          PUBLIC_KB="$(du -sk "$DOMAIN/public_html" | awk '{print $1}')"
          test "$FREE_KB" -gt 2097152 || { echo "Less than 2 GiB free; no deployment performed."; exit 27; }
          test "$PUBLIC_KB" -lt 2097152 || { echo "Current document root exceeds safe backup limit; no deployment performed."; exit 28; }
          echo DIGIBILE_TARGET_PREFLIGHT_OK
          REMOTE

      - name: Upload Digibile template
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          scp -i "$HOME/.deploy_key" -P "$DEPLOY_PORT" -o BatchMode=yes /tmp/digibile-template.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/digibile-template.tar.gz"

      - name: Register and activate on digibile.ir with rollback
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -i "$HOME/.deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          DOMAIN=/home/digibile/domains/digibile.ir
          REGISTRY="$DOMAIN/ui/negar-templates"
          PUBLIC="$DOMAIN/public_html"
          ID=digibile-marketplace
          STAMP="$(date +%Y%m%d-%H%M%S)"
          BACKUP="$DOMAIN/ui/backups/digibile-marketplace-$STAMP"
          SCRIPT="$(find "$DOMAIN/ui" "$DOMAIN" -maxdepth 4 -type f -name 'switch-template.sh' -print -quit)"
          mkdir -p "$BACKUP" "$REGISTRY/$ID"
          cp -a "$REGISTRY/templates.json" "$BACKUP/templates.json"
          cp -a "$REGISTRY/active.json" "$BACKUP/active.json"
          tar -czf "$BACKUP/public_html.tar.gz" -C "$PUBLIC" .
          python3 - "$REGISTRY/active.json" > "$BACKUP/previous-active-id" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: data=json.load(f)
          ids=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      key=k.lower().replace("-","_")
                      if key in ("id","template_id","templateid","active_template","active_template_id","activetemplateid") and isinstance(v,str) and v:
                          ids.append(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          print(ids[0] if ids else "")
          PY
          tar -xzf /tmp/digibile-template.tar.gz -C "$REGISTRY"
          chown -R digibile:digibile "$REGISTRY/$ID"
          python3 - "$REGISTRY/templates.json" "$ID" "$RELEASE_SHA" <<'PY'
          import json,sys,os,tempfile
          path,tid,sha=sys.argv[1:]
          with open(path,encoding="utf-8") as f: data=json.load(f)
          item={"id":tid,"template_id":tid,"slug":tid,"name":"دیجی‌بایل | بازارگاه حرفه‌ای","type":"marketplace","version":"1.0.0","description":"قالب فروشگاهی اختصاصی دیجی‌بایل؛ راست‌چین و واکنش‌گرا.","domain":"digibile.ir","dist":"digibile-marketplace/dist","path":"digibile-marketplace/dist","folder":"digibile-marketplace","entrypoint":"index.html","preview_url":"https://digibile.ir/","source_sha":sha,"status":"published"}
          if isinstance(data,list):
              data=[x for x in data if not (isinstance(x,dict) and (x.get("id")==tid or x.get("template_id")==tid or x.get("slug")==tid))]
              data.append(item)
          elif isinstance(data,dict):
              if isinstance(data.get("templates"),dict):
                  data["templates"][tid]=item
              else:
                  key=next((k for k in ("templates","items","records") if isinstance(data.get(k),list)),None)
                  if key:
                      data[key]=[x for x in data[key] if not (isinstance(x,dict) and (x.get("id")==tid or x.get("template_id")==tid or x.get("slug")==tid))]
                      data[key].append(item)
                  else:
                      data[tid]=item
          else: raise SystemExit("Unsupported templates.json structure; activation stopped.")
          fd,tmp=tempfile.mkstemp(prefix=".templates-",dir=os.path.dirname(path))
          with os.fdopen(fd,"w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2); f.write("\n")
          os.replace(tmp,path)
          PY
          chown digibile:digibile "$REGISTRY/templates.json"
          if ! "$SCRIPT" "$ID"; then
              echo "Activation command failed; restoring previous document root and registry."
              find "$PUBLIC" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              tar -xzf "$BACKUP/public_html.tar.gz" -C "$PUBLIC"
              cp -a "$BACKUP/templates.json" "$REGISTRY/templates.json"
              cp -a "$BACKUP/active.json" "$REGISTRY/active.json"
              exit 30
          fi
          # Some template switchers copy only index.html into the document root.
          # Publish the same-origin snapshot explicitly so the browser never needs CORS or the source API.
          test -s "$REGISTRY/$ID/dist/catalog.json" || { echo "Persisted catalog snapshot missing from release"; exit 32; }
          cp -f "$REGISTRY/$ID/dist/catalog.json" "$PUBLIC/catalog.json"
          chown digibile:digibile "$PUBLIC/catalog.json"
          code=000
          for i in $(seq 1 12); do
              code="$(curl -L --connect-timeout 5 --max-time 15 -sS -o /tmp/digibile-live-check.html -w '%{http_code}' https://digibile.ir/ || true)"
              if [ "$code" = "200" ] && grep -q 'دیجی‌بایل' /tmp/digibile-live-check.html && grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-live-check.html; then
                  echo DIGIBILE_LIVE_TEMPLATE_OK
                  break
              fi
              sleep 3
          done
          if [ "$code" != "200" ] || ! grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-live-check.html; then
              PREVIOUS="$(cat "$BACKUP/previous-active-id" 2>/dev/null || true)"
              if [ -n "$PREVIOUS" ] && [ -d "$REGISTRY/$PREVIOUS/dist" ]; then "$SCRIPT" "$PREVIOUS" || true; fi
              find "$PUBLIC" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
              tar -xzf "$BACKUP/public_html.tar.gz" -C "$PUBLIC"
              cp -a "$BACKUP/templates.json" "$REGISTRY/templates.json"
              cp -a "$BACKUP/active.json" "$REGISTRY/active.json"
              echo "Live verification failed; rollback completed. Backup: $BACKUP"
              exit 31
          fi
          rm -f /tmp/digibile-template.tar.gz
          echo "DIGIBILE_TEMPLATE_REGISTERED=$ID"
          echo "DIGIBILE_TEMPLATE_SOURCE_SHA=$RELEASE_SHA"
          echo "DIGIBILE_BACKUP=$BACKUP"
          REMOTE

      - name: Verify Digibile public endpoint
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --connect-timeout 5 --max-time 20 -sS -o /tmp/digibile-final.html -w '%{http_code}' https://digibile.ir/)"
          echo "DIGIBILE_HTTP=$code"
          test "$code" = "200"
          grep -q 'دیجی‌بایل' /tmp/digibile-final.html
          grep -q 'دسته‌بندی‌های محبوب' /tmp/digibile-final.html
          echo DIGIBILE_PUBLIC_VERIFICATION_OK
          catalog_code="$(curl -L --connect-timeout 5 --max-time 30 -sS -o /tmp/digibile-public-catalog.json -w '%{http_code}' https://digibile.ir/catalog.json)"
          echo "DIGIBILE_STATIC_CATALOG_HTTP=$catalog_code"
          test "$catalog_code" = "200"
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/digibile-public-catalog.json","utf8"));const p=Array.isArray(d.products)?d.products:[];const priced=p.filter(x=>Number(x.price)>0);const images=p.filter(x=>typeof x.image_url==="string"&&x.image_url.length>0);console.log("DIGIBILE_PUBLIC_PRODUCTS="+p.length);console.log("DIGIBILE_PUBLIC_PRICED_PRODUCTS="+priced.length);console.log("DIGIBILE_PUBLIC_IMAGE_PRODUCTS="+images.length);if(d.tenant?.code!=="digibile"||priced.length===0||images.length===0)process.exit(1);'
          echo DIGIBILE_STATIC_CATALOG_VISIBLE_OK

      - name: Inspect Digibile-owned live catalog
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --connect-timeout 5 --max-time 25 -sS -o /tmp/digibile-owned-catalog.json -w '%{http_code}' 'https://sookar.ir/api/public/marketplace?tenantCode=digibile' || true)"
          echo "DIGIBILE_CATALOG_HTTP=$code"
          python3 - <<'PY'
          import json
          path="/tmp/digibile-owned-catalog.json"
          try:
              with open(path,encoding="utf-8") as f: data=json.load(f)
          except Exception as exc:
              print("DIGIBILE_CATALOG_JSON_ERROR="+str(exc))
              raise SystemExit(0)
          products=data.get("products") if isinstance(data,dict) else None
          products=products if isinstance(products,list) else []
          print("DIGIBILE_OWNED_PRODUCTS="+str(len(products)))
          print("DIGIBILE_CATALOG_TENANT="+str((data.get("tenant") or {}).get("code","unknown")))
          print("DIGIBILE_CATALOG_CATEGORIES="+str(len(data.get("categories") or [])))
          local=sum(1 for p in products if isinstance(p,dict) and isinstance(p.get("image_url"),str) and p["image_url"].startswith("/api/public/media/"))
          print("DIGIBILE_LOCAL_MEDIA_PRODUCTS="+str(local))
          if not products: print("DIGIBILE_CATALOG_EMPTY=No seller-owned products with verified stock are published yet.")
          PY

      - name: Import and verify persistent Digibile reference products
        shell: bash
        run: |
          set -euo pipefail
          # This endpoint bootstraps the tenant-scoped reference catalog from the source API
          # when empty, writes products/images metadata to PostgreSQL, then serves database rows.
          code="$(curl -L --connect-timeout 5 --max-time 150 -sS -o /tmp/digibile-reference-catalog.json -w '%{http_code}' 'https://sookar.ir/api/public/marketplace/reference-catalog?tenantCode=digibile')"
          echo "DIGIBILE_REFERENCE_CATALOG_HTTP=$code"
          test "$code" = "200"
          python3 - <<'PY'
          import json,sys
          path="/tmp/digibile-reference-catalog.json"
          with open(path,encoding="utf-8") as f:
              data=json.load(f)
          products=data.get("products") if isinstance(data,dict) else None
          products=products if isinstance(products,list) else []
          total=int(data.get("total",len(products)) or 0)
          tenant=(data.get("tenant") or {}).get("code","unknown")
          categories=data.get("categories") or []
          local=sum(1 for p in products if isinstance(p,dict) and isinstance(p.get("image_url"),str) and p["image_url"].startswith("/api/public/media/catalog/"))
          priced=sum(1 for p in products if isinstance(p,dict) and float(p.get("price") or 0)>0)
          print("DIGIBILE_REFERENCE_PRODUCTS="+str(total))
          print("DIGIBILE_REFERENCE_TENANT="+str(tenant))
          print("DIGIBILE_REFERENCE_CATEGORIES="+str(len(categories)))
          print("DIGIBILE_REFERENCE_PRICED_PRODUCTS="+str(priced))
          print("DIGIBILE_REFERENCE_LOCAL_IMAGES="+str(local))
          print("DIGIBILE_REFERENCE_BOOTSTRAP_STATUS="+str(data.get("bootstrapStatus","unknown")))
          if tenant != "digibile":
              print("ERROR: reference catalog resolved to the wrong tenant",file=sys.stderr)
              sys.exit(2)
          if total < 1 or priced < 1:
              print("ERROR: source API did not populate the persistent reference catalog",file=sys.stderr)
              print("NOTICE="+str(data.get("notice","")),file=sys.stderr)
              sys.exit(3)
          print("DIGIBILE_REFERENCE_CATALOG_PERSISTED_OK")
          PY
