name: Deploy Sookar Main Safely

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA selected by management"
        required: true
        type: string
      requested_by:
        description: "Management panel requester"
        required: false
        type: string

concurrency:
  group: sookar-production-direct
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.3.4 --activate
      - name: Install API dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: API build
        working-directory: apps/api
        run: pnpm build
      - name: Database migrations
        working-directory: apps/api
        run: pnpm migrate
      - name: API tests
        working-directory: apps/api
        run: pnpm test
      - name: Web build
        working-directory: apps/web
        run: pnpm build
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.deploy_key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -T 15 -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Package exact SHA
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.cache' --exclude='*.log' --exclude='tmp' --exclude='temp' --exclude='backups' -czf /tmp/negar-platform.tar.gz .
      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          scp -i ~/.deploy_key -P "$PORT" -o BatchMode=yes /tmp/negar-platform.tar.gz "$HOST:$BASE/negar-platform.tar.gz"
      - name: Deploy with rollback
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          SHA="$RELEASE_SHA"
          RELEASE="$BASE/releases/$SHA"
          CURRENT="$BASE/current"
          PREVIOUS="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          test -f "$BASE/.env"
          test "$(stat -c %a "$BASE/.env")" = "600"
          mkdir -p "$BASE/releases" "$RELEASE"
          rollback() {
            status=$?
            trap - ERR
            if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
              cd "$PREVIOUS"
              docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans || true
              ln -sfn "$PREVIOUS" "$CURRENT"
            fi
            exit "$status"
          }
          trap rollback ERR
          tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
          cp "$BASE/.env" "$RELEASE/.env"
          chmod 600 "$RELEASE/.env"
          if grep -q '^PLATFORM_UPDATE_WORKFLOW=' "$RELEASE/.env"; then
            sed -i 's#^PLATFORM_UPDATE_WORKFLOW=.*#PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml#' "$RELEASE/.env"
          else
            printf 'PLATFORM_UPDATE_WORKFLOW=deploy-sookar-main.yml\n' >> "$RELEASE/.env"
          fi
          if grep -q '^DEPLOYED_SHA=' "$RELEASE/.env"; then
            sed -i "s#^DEPLOYED_SHA=.*#DEPLOYED_SHA=$SHA#" "$RELEASE/.env"
          else
            printf '\nDEPLOYED_SHA=%s\n' "$SHA" >> "$RELEASE/.env"
          fi
          cd "$RELEASE"
          docker compose -p naf-sookar -f docker-compose.production.yml config >/dev/null
          docker compose -p naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1; then break; fi
            [ "$i" = "45" ] && exit 1
            sleep 4
          done
          ln -sfn "$RELEASE" "$CURRENT"
          rm -f "$BASE/negar-platform.tar.gz"
          trap - ERR
          echo "DEPLOYED_SHA=$SHA"
          REMOTE
      - name: Production health and release check
        env:
          RELEASE_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes "$HOST" "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          BASE=/home/sookar/domains/sookar.ir/negar-platform
          curl -fsS http://127.0.0.1:3100/ >/dev/null
          curl -fsS http://127.0.0.1:4000/health >/dev/null
          test "$(readlink -f "$BASE/current")" = "$BASE/releases/$RELEASE_SHA"
          docker ps --format '{{.Names}}' | grep -Fx 'naf-sookar-api-1' >/dev/null
          echo PRODUCTION_DEPLOYMENT_OK
          REMOTE
      - name: Renew DirectAdmin SSL certificate
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" '/usr/local/directadmin/scripts/letsencrypt.sh request sookar.ir 4096'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" '/usr/local/directadmin/custombuild/build rewrite_confs >/dev/null && nginx -t && systemctl reload nginx'

      - name: Configure DirectAdmin Nginx routes
        shell: bash
        run: |
          set -euo pipefail
          HOST='${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}'
          PORT='${{ secrets.DEPLOY_PORT }}'
          ssh -i ~/.deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          USER_NGINX=/usr/local/directadmin/data/users/sookar/nginx.conf
          test -f "$USER_NGINX"
          cp -a "$USER_NGINX" "$USER_NGINX.before-platform-$(date +%Y%m%d-%H%M%S)"
          /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
          python3 - <<'PY'
from pathlib import Path
import re, subprocess
p=Path("/usr/local/directadmin/data/users/sookar/nginx.conf")
text=p.read_text()
def blocks(s,w):
    out=[]
    for m in re.finditer(r"(?m)^\\s*"+w+r"\\b[^\\{]*\\{",s):
        d=0
        for i in range(m.end()-1,len(s)):
            if s[i]=="{": d+=1
            elif s[i]=="}":
                d-=1
                if d==0:
                    out.append((m.start(),i+1)); break
    return out
servers=[x for x in blocks(text,"server") if re.search(r"server_name\\s+[^;]*\\bsookar\\.ir\\b",text[x[0]:x[1]])]
if not servers: raise SystemExit("Sookar server block not found")
api='''    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:4000;
    }
'''
root='''    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3100;
    }
'''
parts=[]; cur=0
for a,b in servers:
    parts.append(text[cur:a]); block=text[a:b]
    locs=blocks(block,"location")
    rootloc=None
    for la,lb in locs:
        if re.match(r"(?s)^\\s*location\\s+/\\s*\\{",block[la:lb]):
            rootloc=(la,lb); break
    if rootloc:
        la,lb=rootloc; block=block[:la]+root+block[lb:]
    else:
        pos=block.rfind("}"); block=block[:pos]+root+block[pos:]
    block=re.sub(r"(?ms)^\\s*location\\s+\\^~\\s+/api/\\s*\\{.*?^\\s*\\}\\s*\\n?","",block)
    first=re.search(r"(?m)^\\s*location\\s+",block)
    pos=first.start() if first else block.rfind("}")
    block=block[:pos]+api+block[pos:]
    parts.append(block); cur=b
parts.append(text[cur:])
p.write_text("".join(parts))
subprocess.run(["nginx","-t"],check=True)
subprocess.run(["systemctl","reload","nginx"],check=True)
print("NGINX_PROXY_ROUTES_OK")
PY
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -L --connect-timeout 5 --max-time 10 -sS -o /tmp/sookar-health.html -w '%{http_code}' https://sookar.ir/ || true)
            echo "PUBLIC_HTTP=$code attempt=$i"
            if [ "$code" = "200" ]; then
              echo "PUBLIC_HTTPS_HEALTH_OK"
              exit 0
            fi
            sleep 2
          done
          head -c 1000 /tmp/sookar-health.html || true
          exit 1
