name: Build Platform

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm --filter @naf/api migrate
      - name: Platform policy checks
        run: |
          test -f database/migrations/008_all_45_module_storage.sql
          test -f database/migrations/009_activate_45_module_runtime.sql
          test -f database/migrations/010_module_field_definitions.sql
          test -f database/migrations/011_module_record_audit.sql
          forbidden=$(printf '\x45\x52\x50')
          pattern="(^|[^A-Za-z])${forbidden}([^A-Za-z]|$)"
          if git grep -n -i -E "$pattern" -- ':!pnpm-lock.yaml'; then
            echo "Forbidden product terminology detected"
            exit 1
          fi

      - name: Platform integrity
        run: pnpm verify:platform
      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Upload web preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out


  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
