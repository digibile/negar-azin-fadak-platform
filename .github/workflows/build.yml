name: Build Platform

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database migrations
        run: pnpm --filter @naf/api migrate

      - name: Platform policy checks
        run: |
          test -f database/migrations/008_all_45_module_storage.sql
          test -f database/migrations/009_activate_45_module_runtime.sql
          test -f database/migrations/010_module_field_definitions.sql
          test -f database/migrations/011_module_record_audit.sql
          forbidden=$(printf '\x45\x52\x50')
          pattern="(^|[^A-Za-z])${forbidden}([^A-Za-z]|$)"
          if git grep -n -i -E "$pattern" -- ':!pnpm-lock.yaml'; then
            echo "Forbidden product terminology detected"
            exit 1
          fi

      - name: Platform integrity
        run: pnpm verify:platform

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test


  inspect-sookar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Inspect server
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -p "${{ secrets.DEPLOY_PORT }}" -o BatchMode=yes -o ConnectTimeout=15 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'echo "=== SOKAR DOMAIN CONFIG ==="; grep -nE "server_name|location /|proxy_pass|root " /usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf 2>/dev/null || true; echo "=== USER NGINX ==="; grep -nE "server_name|location /|proxy_pass|root " /usr/local/directadmin/data/users/sookar/nginx.conf 2>/dev/null || true; echo "=== DOCKER ==="; docker ps --format "table {{.Names}}\\t{{.Status}}\\t{{.Ports}}" | grep naf-sookar || true; echo "=== LOCAL 3100 ==="; curl -sS -I http://127.0.0.1:3100/ | head -5 || true; echo "=== PUBLIC ==="; curl -k -sS -I https://sookar.ir/ | head -10 || true'
