name: Deploy Production to Sookar

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-sookar-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify deployment host is safe
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ssh -p "${{ secrets.DEPLOY_PORT }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             BASE=/home/sookar/domains/sookar.ir
             test -d "$BASE/public_html"
             test -d "$BASE/marketos"
             test -f "$BASE/negar-platform/.env"
             test "$(stat -c %a "$BASE/negar-platform/.env")" = "600"
             mkdir -p "$BASE/negar-platform/releases"
             echo "SAFE_DEPLOYMENT_TARGET=$BASE/negar-platform"
             echo "PUBLIC_HTML_PRESERVED=$BASE/public_html"
             echo "MARKETOS_PRESERVED=$BASE/marketos"'
            then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Package source
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.cache' \
            --exclude='*.log' \
            --exclude='tmp' \
            --exclude='temp' \
            --exclude='backups' \
            -czf /tmp/negar-platform.tar.gz .

      - name: Upload source
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cat > /home/sookar/domains/sookar.ir/negar-platform/negar-platform.tar.gz' \
            < /tmp/negar-platform.tar.gz

      - name: Deploy Docker Compose
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             BASE=/home/sookar/domains/sookar.ir/negar-platform
             RELEASE_SHA=${{ github.sha }}
             RELEASE="$BASE/releases/$RELEASE_SHA"
             mkdir -p "$RELEASE"
             tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
             cp "$BASE/.env" "$RELEASE/.env"
             chmod 600 "$RELEASE/.env"

             cd "$RELEASE"

             docker compose --project-name naf-sookar -f docker-compose.production.yml config >/dev/null
             docker compose --project-name naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans

             docker compose --project-name naf-sookar -f docker-compose.production.yml ps

             test -d "$BASE/releases"

             rm -f "$BASE/negar-platform.tar.gz"
             ln -sfn "$RELEASE" "$BASE/current"

             find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d ! -name "$RELEASE_SHA" -mtime +7 -exec rm -rf {} + 2>/dev/null || true'

      - name: Configure Sookar Nginx reverse proxy
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
             USER_NGINX=/usr/local/directadmin/data/users/sookar/nginx.conf
             BACKUP="/root/sookar-nginx-$(date +%Y%m%d-%H%M%S).conf"

             test -f "$DOMAIN_CONF"
             test -f "$USER_NGINX"

             cp -a "$USER_NGINX" "$BACKUP"

             /usr/local/directadmin/custombuild/build rewrite_confs

             python3 - <<'"'"'PY'
from pathlib import Path
import re

path = Path("/usr/local/directadmin/data/users/sookar/nginx.conf")
text = path.read_text()

server_re = re.compile(r"(?ms)(?P<block>server\s*\{.*?\n\})")
changed = False

def patch_server(m):
    global changed
    block = m.group("block")
    if not re.search(r"server_name\s+[^;]*\bsookar\.ir\b", block):
        return block

    lines = block.splitlines()
    out = []
    server_depth = 0
    in_root = False
    root_depth = 0
    replaced = False

    for line in lines:
        stripped = line.strip()
        opens = line.count("{")
        closes = line.count("}")

        if not in_root and re.match(r"location\s+/(?:\{|\s)", stripped):
            in_root = True
            root_depth = server_depth + opens - closes

        if in_root and re.match(r"proxy_pass\s+", stripped):
            indent = line[:len(line)-len(line.lstrip())]
            out.append(f"{indent}proxy_pass http://127.0.0.1:3100;")
            replaced = True
            changed = True
        else:
            out.append(line)

        server_depth += opens - closes
        if in_root and server_depth < root_depth:
            in_root = False

    if not replaced:
        raise SystemExit("Sookar server block found, but no root proxy_pass was found")
    return "\n".join(out)

patched = server_re.sub(patch_server, text)

if not changed:
    raise SystemExit("Sookar server block was not found or was not patched")

path.write_text(patched)
PY

             nginx -t
             systemctl reload nginx
             echo "SOOKAR_NGINX_PROXY=127.0.0.1:3100"
             grep -n "proxy_pass http://127.0.0.1:3100" "$USER_NGINX" | head -10'

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh -p "${{ secrets.DEPLOY_PORT }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1'; then
              echo "DEPLOYMENT_HEALTH_OK"
              exit 0
            fi
            sleep 4
          done

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /home/sookar/domains/sookar.ir/negar-platform/current && docker compose --project-name naf-sookar -f docker-compose.production.yml ps && docker compose --project-name naf-sookar -f docker-compose.production.yml logs --tail=120 api web'
          exit 1
