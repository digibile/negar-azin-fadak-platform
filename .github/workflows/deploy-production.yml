name: Deploy Production to Sookar

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy-sookar-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify deployment host is safe
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ssh -p "${{ secrets.DEPLOY_PORT }}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             BASE=/home/sookar/domains/sookar.ir
             test -d "$BASE/public_html"
             test -d "$BASE/marketos"
             test -f "$BASE/negar-platform/.env"
             test "$(stat -c %a "$BASE/negar-platform/.env")" = "600"
             mkdir -p "$BASE/negar-platform/releases"
             echo "SAFE_DEPLOYMENT_TARGET=$BASE/negar-platform"
             echo "PUBLIC_HTML_PRESERVED=$BASE/public_html"
             echo "MARKETOS_PRESERVED=$BASE/marketos"'
            then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Package source
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.cache' \
            --exclude='*.log' \
            --exclude='tmp' \
            --exclude='temp' \
            --exclude='backups' \
            -czf /tmp/negar-platform.tar.gz .

      - name: Upload source
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cat > /home/sookar/domains/sookar.ir/negar-platform/negar-platform.tar.gz' \
            < /tmp/negar-platform.tar.gz

      - name: Deploy Docker Compose
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             BASE=/home/sookar/domains/sookar.ir/negar-platform
             RELEASE_SHA=${{ github.sha }}
             RELEASE="$BASE/releases/$RELEASE_SHA"
             mkdir -p "$RELEASE"
             tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
             cp "$BASE/.env" "$RELEASE/.env"
             chmod 600 "$RELEASE/.env"

             cd "$RELEASE"

             docker compose --project-name naf-sookar -f docker-compose.production.yml config >/dev/null
             docker compose --project-name naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans

             docker compose --project-name naf-sookar -f docker-compose.production.yml ps

             test -d "$BASE/releases"

             rm -f "$BASE/negar-platform.tar.gz"
             ln -sfn "$RELEASE" "$BASE/current"

             find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d ! -name "$RELEASE_SHA" -mtime +7 -exec rm -rf {} + 2>/dev/null || true'

      - name: Configure Sookar Nginx reverse proxy
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'set -e
             DOMAIN_CONF=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
             USER_NGINX=/usr/local/directadmin/data/users/sookar/nginx.conf
             BACKUP="/root/sookar-nginx-$(date +%Y%m%d-%H%M%S).conf"

             test -f "$DOMAIN_CONF"
             test -f "$USER_NGINX"

             cp -a "$USER_NGINX" "$BACKUP"

             /usr/local/directadmin/custombuild/build rewrite_confs

             python3 - <<'PY'
from pathlib import Path
import re

path = Path("/usr/local/directadmin/data/users/sookar/nginx.conf")
text = path.read_text()

def find_blocks(text, keyword):
    out = []
    for m in re.finditer(r"(?m)^\s*" + keyword + r"\b[^\{]*\{", text):
        start = m.start()
        depth = 0
        for i in range(m.end() - 1, len(text)):
            if text[i] == "{":
                depth += 1
            elif text[i] == "}":
                depth -= 1
                if depth == 0:
                    out.append((start, i + 1))
                    break
    return out

servers = find_blocks(text, "server")
targets = [
    (a, b) for a, b in servers
    if re.search(r"server_name\s+[^;]*\bsookar\.ir\b", text[a:b])
]

if not targets:
    raise SystemExit("No Sookar server blocks found")

proxy_location = """    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3100;
    }"""

parts = []
cursor = 0
for a, b in targets:
    parts.append(text[cursor:a])
    block = text[a:b]

    locations = find_blocks(block, "location")
    root = None
    for la, lb in locations:
        if re.match(r"(?s)^\s*location\s+/\s*\{", block[la:lb]):
            root = (la, lb)
            break

    if root:
        la, lb = root
        chunk = block[la:lb]
        chunk = re.sub(r"(?ms)^\s*proxy_pass\s+[^;]+;\s*\n?", "", chunk)
        insert = chunk.rfind("}")
        chunk = chunk[:insert] + "        proxy_pass http://127.0.0.1:3100;\n" + chunk[insert:]
        block = block[:la] + chunk + block[lb:]
    else:
        insert = block.rfind("}")
        block = block[:insert] + "\n" + proxy_location + "\n" + block[insert:]

    parts.append(block)
    cursor = b

parts.append(text[cursor:])
path.write_text("".join(parts))
print(f"NGINX_CONFIGURED_BLOCKS={len(targets)}")
PY
             nginx -t
             systemctl reload nginx
             echo "SOOKAR_NGINX_PROXY=127.0.0.1:3100"
             grep -n "proxy_pass http://127.0.0.1:3100" "$USER_NGINX" | head -10'

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh -p "${{ secrets.DEPLOY_PORT }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1'; then
              echo "DEPLOYMENT_HEALTH_OK"
              exit 0
            fi
            sleep 4
          done

          ssh -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /home/sookar/domains/sookar.ir/negar-platform/current && docker compose --project-name naf-sookar -f docker-compose.production.yml ps && docker compose --project-name naf-sookar -f docker-compose.production.yml logs --tail=120 api web'
          exit 1
