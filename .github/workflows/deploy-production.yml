name: Deploy Production to Sookar

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-sookar-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deployment host
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify deployment host is safe
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.DEPLOY_PORT }}"             -o BatchMode=yes             "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"             'set -e
             BASE=/home/sookar/domains/sookar.ir
             test -d "$BASE/public_html"
             test -d "$BASE/marketos"
             test -f "$BASE/negar-platform/.env"
             test "$(stat -c %a "$BASE/negar-platform/.env")" = "600"
             mkdir -p "$BASE/negar-platform/releases"
             echo "SAFE_DEPLOYMENT_TARGET=$BASE/negar-platform"
             echo "PUBLIC_HTML_PRESERVED=$BASE/public_html"
             echo "MARKETOS_PRESERVED=$BASE/marketos"'

      - name: Package source
        run: |
          set -euo pipefail
          tar             --exclude='.git'             --exclude='node_modules'             --exclude='.next'             --exclude='.cache'             --exclude='*.log'             --exclude='tmp'             --exclude='temp'             --exclude='backups'             -czf /tmp/negar-platform.tar.gz .

      - name: Upload source
        run: |
          set -euo pipefail
          scp -P "${{ secrets.DEPLOY_PORT }}"             /tmp/negar-platform.tar.gz             "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/sookar/domains/sookar.ir/negar-platform/"

      - name: Deploy Docker Compose
        run: |
          set -euo pipefail

          ssh -p "${{ secrets.DEPLOY_PORT }}"             "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"             'set -e
             BASE=/home/sookar/domains/sookar.ir/negar-platform
             RELEASE="$BASE/releases/${GITHUB_SHA:-unknown}"
             mkdir -p "$RELEASE"
             tar -xzf "$BASE/negar-platform.tar.gz" -C "$RELEASE"
             cp "$BASE/negar-platform/.env" "$RELEASE/.env"
             chmod 600 "$RELEASE/.env"

             cd "$RELEASE"

             docker compose --project-name naf-sookar -f docker-compose.production.yml config >/dev/null
             docker compose --project-name naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans

             docker compose --project-name naf-sookar -f docker-compose.production.yml ps

             test -d "$BASE/releases"

             rm -f "$BASE/negar-platform.tar.gz"
             ln -sfn "$RELEASE" "$BASE/current"

             find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d ! -name "${GITHUB_SHA:-unknown}" -mtime +7 -exec rm -rf {} + 2>/dev/null || true'

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh -p "${{ secrets.DEPLOY_PORT }}"               "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"               'curl -fsS http://127.0.0.1:3100/ >/dev/null 2>&1'; then
              echo "DEPLOYMENT_HEALTH_OK"
              exit 0
            fi
            sleep 4
          done

          ssh -p "${{ secrets.DEPLOY_PORT }}"             "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"             'cd /home/sookar/domains/sookar.ir/negar-platform/current && docker compose --project-name naf-sookar -f docker-compose.production.yml ps && docker compose --project-name naf-sookar -f docker-compose.production.yml logs --tail=120 api web'
          exit 1
