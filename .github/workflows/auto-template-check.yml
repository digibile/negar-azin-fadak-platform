name: Auto template verification

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/store/auto/**"
      - "apps/api/src/domain-marketplace.ts"
      - "apps/api/package.json"
      - "apps/api/tsconfig.json"
      - "apps/web/package.json"
      - "apps/web/tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/auto-template-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check API
        run: pnpm --filter @naf/api build
      - name: Type-check web app
        run: pnpm --filter @naf/web typecheck
      - name: Build web app
        run: pnpm --filter @naf/web build
