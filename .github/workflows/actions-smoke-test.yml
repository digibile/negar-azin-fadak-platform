name: Sookar Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          tar --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.cache' --exclude='*.log' --exclude='tmp' --exclude='temp' --exclude='backups' -czf /tmp/app.tar.gz .
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'mkdir -p /home/sookar/domains/sookar.ir/negar-platform/releases'
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'cat > /home/sookar/domains/sookar.ir/negar-platform/app.tar.gz' < /tmp/app.tar.gz
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'set -e
            BASE=/home/sookar/domains/sookar.ir/negar-platform
            RELEASE="$BASE/releases/${{ github.sha }}"
            mkdir -p "$RELEASE"
            tar -xzf "$BASE/app.tar.gz" -C "$RELEASE"
            cp "$BASE/.env" "$RELEASE/.env"
            chmod 600 "$RELEASE/.env"
            cd "$RELEASE"
            docker compose --project-name naf-sookar -f docker-compose.production.yml config >/dev/null
            docker compose --project-name naf-sookar -f docker-compose.production.yml up -d --build --remove-orphans
            ln -sfn "$RELEASE" "$BASE/current"
            rm -f "$BASE/app.tar.gz"
          '
      - name: Nginx
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$HOST" 'set -e
            DOMAIN=/usr/local/directadmin/data/users/sookar/domains/sookar.ir.conf
            test -f "$DOMAIN"
            cp -a "$DOMAIN" "/root/sookar-domain-backup-$(date +%Y%m%d-%H%M%S).conf"
            python3 - "$DOMAIN" <<'"'"'PY'"'"'
from pathlib import Path
import re,sys
p=Path(sys.argv[1]); s=p.read_text()
def block(text,start):
    op=text.find("{",start)
    if op<0:return None
    d=0
    for i in range(op,len(text)):
        if text[i]=="{":d+=1
        elif text[i]=="}":
            d-=1
            if d==0:return start,i+1
    return None
m=re.search(r"server\s*\{",s)
found=False
while m:
    b=block(s,m.start())
    if not b: break
    a,z=b; sb=s[a:z]
    if re.search(r"server_name[^;]*\bsookar\.ir\b",sb):
        lm=re.search(r"location\s+/\s*\{",sb)
        if lm:
            lb=block(sb,lm.start()); la,lz=lb; loc=sb[la:lz]
            loc=re.sub(r"proxy_pass\s+[^;]+;","proxy_pass http://127.0.0.1:3100;",loc,count=1)
            if "proxy_pass http://127.0.0.1:3100;" not in loc:
                loc=loc[:loc.rfind("}")]+"        proxy_pass http://127.0.0.1:3100;\n"+loc[loc.rfind("}"):]
            sb=sb[:la]+loc+sb[lz:]
        else:
            pos=sb.rfind("}")
            sb=sb[:pos]+"\n    location / {\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_pass http://127.0.0.1:3100;\n    }\n"+sb[pos:]
        s=s[:a]+sb+s[z:]; found=True; break
    m=re.search(r"server\s*\{",s,z)
if not found: raise SystemExit("Sookar server block not found")
p.write_text(s)
PY
            /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
            nginx -t
            systemctl reload nginx
          '
      - name: External health
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -k -L -sS -o /tmp/sookar.html -w '%{http_code}' https://sookar.ir/ || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              echo SOOKAR_ONLINE_OK
              exit 0
            fi
            sleep 3
          done
          head -c 1000 /tmp/sookar.html || true
          exit 1
