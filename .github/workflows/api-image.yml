name: Build API Container

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "database/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @naf/api build

      - name: Build container
        run: docker build -f apps/api/Dockerfile -t ghcr.io/${{ github.repository_owner }}/negar-azin-fadak-api:${{ github.sha }} .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/negar-azin-fadak-api:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/negar-azin-fadak-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/negar-azin-fadak-api:main
          docker push ghcr.io/${{ github.repository_owner }}/negar-azin-fadak-api:main
