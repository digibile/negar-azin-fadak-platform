services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "4000:4000"
    environment:
      CORS_ORIGIN: https://${CODESPACE_NAME}-3000.app.github.dev

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${CODESPACE_NAME}-4000.app.github.dev
    ports:
      - "3000:3000"

  notification-worker:
    environment:
      NOTIFICATION_WORKER_BATCH: "10"
      NOTIFICATION_WORKER_POLL_MS: "2000"
